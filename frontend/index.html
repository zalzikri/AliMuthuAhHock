<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day One</title>
<link rel="icon" type="image/png" href="/brand/favicon.png">
<style>
/* ============ DESIGN TOKENS - change the look from here only ============ */
:root{
  /* Jalur Gemilang. Official CMYK from Jabatan Penerangan:
       blue   C100 M75 Y0  K0
       red    C0   M95 Y100 K0
       yellow C0   M9  Y100 K0
     converted to sRGB through the ColorSync Generic CMYK profile
     (LittleCMS, relative colorimetric). Pantone 2768 / 199 / 108 for print. */
  --blue:#024B8F;
  --red:#DA332B;
  --yellow:#FEDD1B;
  --ink:#0A1033;          /* near-black with the canton in it */
  --mute:#5A6076;
  --line:#DCE0EC;
  --bg:#F5EEDC;           /* sampled from the background art, so there is no seam */
  --card:#FFFFFF;
  --paper:#F4F2ED;        /* warm paper, for poster blocks */
  --ok:#EDF2F8;           /* calm/waiting surface, navy-tinted */
  --done:#024B8F;         /* completed marker uses the flag blue */
  /* shape */
  --r-lg:2px; --r-md:2px; --r-sm:2px; --r-xs:1px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  /* rhythm */
  --pad:16px; --gap:22px;
  /* type */
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --fs-body:14px; --fs-small:12px; --fs-micro:10px; --fs-hero:19px;
}
/* ======================================================================== */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs-body)/1.5 var(--font)}
.wrap{max-width:1020px;margin:0 auto;padding:26px 22px 60px;position:relative}
header{position:relative;margin:0 0 26px;padding:0 0 14px}
header .mark{display:flex;align-items:flex-end;gap:10px}
header .logo{width:72px;height:72px;border:2px solid var(--ink);display:block;object-fit:cover}
header b{font-size:40px;line-height:.9;letter-spacing:-.045em;font-weight:800;color:var(--ink)}
header .by{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
  writing-mode:vertical-rl;transform:rotate(180deg);height:72px;white-space:nowrap;align-self:flex-end;
  border-left:3px solid var(--red);padding-left:6px;margin-bottom:2px}
header .stripes{position:absolute;right:0;top:-26px;display:flex;gap:4px;align-items:flex-start}
header .stripes i{display:block;width:18px}
header .stripes i:nth-child(1){height:74px;background:var(--blue)}
header .stripes i:nth-child(2){height:46px;background:var(--red)}
header .stripes i:nth-child(3){height:98px;background:var(--yellow)}
header .rule{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--ink)}
header .rule::after{content:"";position:absolute;left:0;bottom:0;width:38%;height:3px;background:var(--blue)}
h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0 0 9px;font-weight:600}
.cols{display:flex;gap:var(--gap);align-items:flex-start}
.cols>.main{flex:1 1 56%;min-width:0}
.cols>.side{flex:1 1 44%;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--pad)}
label{display:block;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0 0 4px}
input,select{width:100%;border:1.5px solid var(--ink);border-radius:1px;padding:7px 9px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--ink)}
.field{margin-bottom:11px}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:1px;overflow:hidden;width:fit-content}
.seg button{border:0;background:#fff;padding:6px 13px;font:inherit;font-size:12.5px;color:var(--mute);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--blue);color:#fff;font-weight:600}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:5px;padding:8px 17px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btn.ghost{background:#fff;color:var(--blue)}
.btn.sm{padding:5px 11px;font-size:12px;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.plan{font-size:12.5px}
.plan div{display:flex;gap:7px;padding:4px 0;border-bottom:1px solid var(--line)}
.plan div:last-child{border-bottom:0}
.plan .why{color:var(--mute);font-size:11px;margin-left:auto;text-align:right}
.plan s{color:#A9AEC0}
.plan .why{color:var(--mute)}
.turn{border:2px solid var(--blue);border-radius:var(--r-lg);padding:var(--pad);background:var(--card);margin-bottom:var(--pad)}
.turn.calm{border:1px solid var(--line);background:var(--ok);border-left:4px solid var(--blue)}
.turn .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.turn .v{font-size:var(--fs-hero);font-weight:650;margin:6px 0 5px;letter-spacing:-.01em}
.turn .d{font-size:13px;color:#4a5159}
.acts{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.pre{border:1px solid var(--line);border-radius:6px;background:#fafbfc;padding:10px 11px;margin-top:11px;font-size:12.5px;line-height:1.55}
.howto{margin:12px 0 0;padding-left:20px;font-size:13px;line-height:1.6}
.howto li{margin-bottom:5px}
.howto li::marker{color:var(--mute);font-weight:600}
.pre table{width:100%;border-collapse:collapse}
.pre td{padding:3px 0;vertical-align:top}
.pre td:first-child{color:var(--mute);width:40%;padding-right:10px;font-size:11.5px}
.steps{font-size:13px}
.steps .row{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.steps .row:last-child{border-bottom:0}
.ico{width:15px;height:15px;border:1px solid var(--line);border-radius:4px;flex:none;margin-top:2px;font-size:9px;display:flex;align-items:center;justify-content:center;color:#fff;background:#fff}
.ico.done{background:var(--done);border-color:var(--done)}
.ico.now{border:2px solid var(--red)}
.ico.open{border-color:var(--mute);background:repeating-linear-gradient(45deg,#fff,#fff 2px,#eceff2 2px,#eceff2 4px)}
.steps em{font-style:normal;color:var(--mute);font-size:11.5px;display:block}
.card{border:1px solid var(--line);border-radius:var(--r-md);padding:11px 12px;margin-bottom:8px;background:var(--card)}
.card b{font-size:13.5px}
.card p{margin:3px 0 7px;font-size:12px;color:var(--mute)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:10px;color:var(--mute);margin:0 4px 4px 0}
.chip.red{border-color:var(--red);color:var(--red)}
.turn .k{color:var(--red);font-weight:600}
a{color:inherit}
.doc{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line);text-decoration:none}
.doc:last-child{border-bottom:0}
.new{border:1px solid var(--red);color:var(--red);border-radius:4px;padding:0 5px;font-size:9.5px;height:fit-content}
.link{border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:#fafbfc;font-size:12.5px;word-break:break-all;margin:10px 0}
.muted{color:var(--mute);font-size:12px}

/* ================= POSTER LAYER ================= */
body{background:var(--bg)}
.poster{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.poster svg{position:absolute;inset:0;width:100%;height:100%}
.grain{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;opacity:.17;mix-blend-mode:multiply}
.wrap{z-index:2;margin-left:auto;margin-right:4vw;max-width:900px}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left center}
.tag{position:fixed;left:3.2vw;bottom:5vh;z-index:2;background:var(--yellow);color:var(--ink);
  font:600 10.5px/1.25 var(--mono);letter-spacing:.06em;text-transform:uppercase;
  writing-mode:vertical-rl;transform:rotate(180deg);padding:12px 9px;max-height:46vh}
.tag b{font-weight:800}
/* panels read as paper pasted onto the poster */
.panel,.turn,.card{border:2px solid var(--ink)!important;background:#fff}
.turn{border-color:var(--blue)!important;border-width:3px!important}
.turn.calm{border:2px solid var(--ink)!important;border-left:8px solid var(--blue)!important;background:#fff}
h2{font-family:var(--mono);letter-spacing:.08em}
.turn .k{font-family:var(--mono);letter-spacing:.06em}
.btn{border-radius:1px}
@media (max-width:1100px){.wrap{margin-right:auto}.bg{opacity:.25}}
.warn{margin:10px 0 0;font-size:12.5px;color:var(--red);font-weight:600}
.hide{display:none}
</style></head>
<body>
<div class="poster" aria-hidden="true"><img class="bg" src="/brand/bg.jpg" alt=""></div>
<svg class="grain" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="tag"><b>KopiCode 2026 presents</b><br>Day One: onboarding<br>Ali &middot; Muthu &middot; Ah Hock<br>13/11/26</div>
<div class="wrap">
<header>
  <div class="mark"><img class="logo" src="/brand/logo-160.jpg" alt="Ali, Muthu and Ah Hock"><b>Day&nbsp;One</b><span class="by">Ali Muthu Ah Hock</span></div>
  <div class="rule"></div>
</header>
<div id="app"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const api = (p, o) => fetch("/api" + p, o).then(r => r.json());
let F = {employment:"staff", job_family:"developer", project:"odin", want_claude:true};
let PROJECTS = {}, TIMER = null;

const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function boot(){
  PROJECTS = await api("/projects");
  const m = location.pathname.match(/^\/n\/(.+)$/);
  if (m) { watch(m[1]); } else { renderForm(); }
}

/* ---------- the form ---------- */
function renderForm(){
  const opts = Object.keys(PROJECTS).sort().map(k =>
    `<option value="${k}" ${k===F.project?"selected":""}>${k}</option>`).join("");
  $("#app").innerHTML = `
  <div class="cols">
    <div class="main panel">
      <h2>Start someone</h2>
      <div class="field"><label>Full name</label><input id="name" placeholder="Nurul Aina binti Rahim"></div>
      <div class="field"><label>Your Gamuda email — the request is raised in your name</label>
        <input id="starter" placeholder="you@gamuda.com.my"></div>
      <div class="field"><label>Employment</label>
        <div class="seg" id="seg-emp">
          <button data-v="staff">Staff</button><button data-v="intern">Intern</button></div></div>
      <div class="field"><label>Job</label>
        <div class="seg" id="seg-job">
          <button data-v="developer">Developer</button><button data-v="other">Non-developer</button></div></div>
      <div class="field"><label>Project — optional</label>
        <select id="project"><option value="">no project yet</option>${opts}</select></div>
      <div class="field"><label>Start date — optional</label><input id="start" placeholder="17-11-2026"></div>
      <button class="btn" id="go">Start onboarding</button>
      <div id="err" class="muted" style="margin-top:9px"></div>
    </div>
    <div class="side panel">
      <h2>What we will ask for</h2>
      <div id="plan" class="plan"></div>
    </div>
  </div>`;
  bindSeg("#seg-emp", "employment"); bindSeg("#seg-job", "job_family");
  $("#project").onchange = e => { F.project = e.target.value; preview(); };
  $("#go").onclick = submit;
  preview();
}
function bindSeg(sel, key){
  const box = $(sel);
  [...box.children].forEach(b => {
    b.classList.toggle("on", b.dataset.v === F[key]);
    b.onclick = () => { F[key] = b.dataset.v;
      [...box.children].forEach(x => x.classList.toggle("on", x === b)); preview(); };
  });
}
async function preview(){
  const q = new URLSearchParams({employment:F.employment, job_family:F.job_family,
                                 want_claude:F.want_claude});
  if (F.project) q.set("project", F.project);
  const p = await api("/preview?" + q);
  const chan = {gsd_auto:"GSD", slack_guided:"Slack", self:"you", person:"a person"};
  $("#plan").innerHTML =
    p.steps.map(s => `<div><span>${esc(s.title)}</span><span class="why">${chan[s.channel]}</span></div>`).join("")
    + p.skipped.map(s => `<div><s>${esc(s.title)}</s><span class="why">${esc(s.why)}</span></div>`).join("")
    + `<div style="border:0;padding-top:9px"><b>${p.steps.length} requests</b>
       <span class="why">${p.skipped.length} skipped</span></div>`;
}
async function submit(){
  const name = $("#name").value.trim(), starter = $("#starter").value.trim();
  if (!name || !starter) { $("#err").textContent = "Name and your email are both needed."; return; }
  $("#go").disabled = true;
  const v = await api("/onboardings", {method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({name, starter_email:starter, employment:F.employment,
      job_family:F.job_family, project:F.project||null, start_date:$("#start").value.trim()})});
  const url = location.origin + "/n/" + v.token;
  $("#app").innerHTML = `<div class="panel" style="max-width:560px">
    <h2>Started</h2>
    <div class="turn"><div class="k">Raised now</div>
      <div class="v">1 request is open</div>
      <div class="d">${v.progress.total - 1} more are queued behind it. They go out by themselves.</div></div>
    <p class="muted">Send ${esc(name.split(" ")[0])} this link. There is no password.</p>
    <div class="link">${url}</div>
    <div class="acts"><button class="btn" onclick="location.href='/n/${v.token}'">Open her page</button>
    <button class="btn ghost sm" onclick="navigator.clipboard.writeText('${url}')">Copy link</button></div>
  </div>`;
}

/* ---------- her page ---------- */
function watch(token){
  const tick = async () => { try { render(await api("/n/" + token), token); } catch(e){} };
  tick(); clearInterval(TIMER); TIMER = setInterval(tick, 1500);
}
const CH = {
  self:   {k:"Your turn — 1 thing", act:"I have done it"},
  slack_guided:{k:"Your turn — this one is not GSD", act:"I have sent it"},
  person: {k:"Nothing for you today — waiting on a person", act:"He has added me"},
};
function card(v, token){
  const t = v.your_turn;
  if (!t) {
    const w = v.waiting_on;
    if (!w) return `<div class="turn"><div class="k">Done</div>
      <div class="v">You have everything</div>
      <div class="d">${v.progress.done} of ${v.progress.total} ready.</div></div>`;
    return `<div class="turn calm"><div class="k">Nothing for you today</div>
      <div class="v">${esc(w.title)} is with IT</div>
      <div class="d">GSD #${w.ticket_id} &middot; usually ${w.eta_days} days. We will tell you when it lands.</div></div>`;
  }
  const c = (t.then_self && t.state === "waiting_user")
    ? {k:"Your turn — IT has granted it", act:"I am in"}
    : (CH[t.channel] || CH.self);
  const fields = (t.fields||[]).length ? `<div class="pre"><table>${
      t.fields.map(f => `<tr><td>${esc(f.label)}</td><td>${esc(f.value)}</td></tr>`).join("")}</table></div>` : "";
  const howto = (t.howto||[]).length ? `<ol class="howto">${
      t.howto.map(h => `<li>${esc(h)}</li>`).join("")}</ol>` : "";
  const ask = t.ask ? `<div class="pre">${esc(t.ask)}</div>` : "";
  const emailAsk = t.ask_email ? `<div class="pre">
      <label>Which address did you sign in with?</label>
      <input id="we" value="${esc(v.guess_email)}">
      <span class="muted">We guessed it from your name. Correct it if it differs.</span>
    </div>` : "";
  const copy = (t.fields||[]).length ? t.fields.map(f => f.label + ": " + f.value).join("\n") : t.ask;
  return `<div class="turn ${t.channel==="person"?"calm":""}">
    <div class="k">${c.k}</div>
    <div class="v">${esc(t.title)}</div>
    <div class="d">${esc(t.hint || "")}</div>
    ${howto}${fields}${ask}${emailAsk}
    ${t.id==="password_reset" && v.link_expires_in_hours !== null ?
      (v.link_expires_in_hours > 0
        ? `<p class="warn">Google's sign-in link expires in ${Math.floor(v.link_expires_in_hours)} hours.</p>`
        : `<p class="warn">That link has expired. IT must reset the account - raise a GSD ticket.</p>`) : ""}
    ${t.id==="password_reset" ? '<p class="muted" style="margin-top:9px">Day One never sees or stores your password.</p>' : ""}
    <div class="acts">
      ${copy ? `<button class="btn ghost sm" onclick='navigator.clipboard.writeText(${JSON.stringify(copy)})'>Copy</button>`:""}
      ${t.channel==="person" && v.poc_email ? `<a class="btn ghost sm" href="mailto:${v.poc_email}">Email ${esc(v.poc_name)}</a>`:""}
      <button class="btn sm" onclick="confirmStep('${token}','${t.id}')">${c.act}</button>
    </div></div>`;
}
async function confirmStep(token, step){
  const el = document.querySelector("#we");
  render(await api(`/n/${token}/steps/${step}/confirm`, {method:"POST",
    headers:{"content-type":"application/json"},
    body: JSON.stringify({work_email: el ? el.value.trim() : ""})}), token);
}
function render(v, token){
  const icon = s => s.state==="done" ? '<span class="ico done">&#10003;</span>'
    : s.state==="open" ? '<span class="ico open"></span>'
    : s.state.startsWith("waiting") ? '<span class="ico now"></span>' : '<span class="ico"></span>';
  const sub = s => s.state==="done" ? "ready"
    : s.state==="open" ? `with IT &middot; GSD #${s.ticket_id} &middot; usually ${s.eta_days} days`
    : s.state==="waiting_user" ? "your turn"
    : s.state==="waiting_person" ? `${esc(v.poc_name)} does this` 
    : "queued &middot; needs " + s.blocked_by.join(", ");
  $("#app").innerHTML = `<div class="cols">
    <div class="main">
      ${card(v, token)}
      <div class="panel"><h2>Everything else — ${v.progress.done} of ${v.progress.total} ready</h2>
      <div class="steps">${v.steps.map(s => `<div class="row">${icon(s)}
        <span>${esc(s.title)}<em>${sub(s)}</em></span></div>`).join("")}</div>
      ${v.work_email ? `<p class="muted" style="margin-top:11px">Your address: <b>${esc(v.work_email)}</b></p>` : ""}
      </div>
    </div>
    <div class="side panel" id="side"></div>
  </div>`;
  side(v);
}
async function side(v){
  const d = await api("/directory");
  const mine = d.find(x => x.key === (v.project||"").toLowerCase());
  const idle = !v.your_turn;
  $("#side").innerHTML = `
    ${idle ? `<h2>While you wait</h2>
      <div class="card"><b>Test what you know</b>
        <p>A short quiz on GTech. Two minutes, no access needed.</p>
        <button class="btn sm" onclick="alert('Quiz drops in here')">Start the quiz</button></div>` : ""}
    ${mine ? `<h2>Your project</h2>
      <div class="card"><b>${esc(mine.name)}</b><p>${esc(mine.one_line)}</p>
        <span class="chip">ask ${esc(mine.poc_name)}</span>
        ${(mine.stack||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join("")}
        <div style="margin-top:7px">
          <a class="muted" href="${mine.url}" target="_blank">Open it &rarr;</a>
          ${mine.docs_url?` &nbsp; <a class="muted" href="${mine.docs_url}" target="_blank">Docs &rarr;</a>`:""}
        </div>
        <p style="margin-top:7px"><b>Try in 5 minutes:</b> ${esc(mine.try_in_5)}</p></div>
      <div style="height:16px"></div>`:""}
    <h2>What GTech builds</h2>
    ${d.filter(x => x.key !== (v.project||"")).map(x => `<div class="card"><b>${esc(x.name)}</b>
       <p>${esc(x.one_line||"")}</p>
       <span class="chip">${esc(x.status)}</span>
       <span class="chip">ask ${esc(x.poc_name)}</span>
       <div style="margin-top:6px"><a class="muted" href="${x.url}" target="_blank">Open it &rarr;</a>
       ${x.docs_url?` &nbsp; <a class="muted" href="${x.docs_url}" target="_blank">Docs &rarr;</a>`:""}</div>
       </div>`).join("")}`;
}
boot();
</script></body></html>
