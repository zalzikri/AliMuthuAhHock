<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day One · GTech onboarding</title>
<link rel="icon" type="image/png" href="/brand/favicon.png?v=6">
<style>
/* Self-hosted, so the demo does not depend on the venue Wi-Fi.
   Archivo: sharp poster grotesk for headings and labels. Work Sans: body text and buttons. */
@font-face{font-family:"Archivo";src:url(/brand/fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:"Work Sans";src:url(/brand/fonts/work-sans.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(/brand/fonts/jetbrains-mono.woff2) format("woff2");font-weight:400 800;font-display:swap}
/* ===================== DESIGN TOKENS =====================
   Jalur Gemilang only. Official CMYK (Jabatan Penerangan):
     blue C100 M75 Y0 K0 | red C0 M95 Y100 K0 | yellow C0 M9 Y100 K0
   to sRGB through the ColorSync Generic CMYK profile, relative colorimetric.
   Pantone 2768 / 199 / 108 for print. Every other colour below is one of
   these four at a lower opacity - no other hue is used.
   Shape language: soft, smooth, asymmetric. One corner on each surface is
   tighter than the other three. One shadow per surface, no blur effects. */
:root{
  --blue:#024B8F; --red:#DA332B; --yellow:#FEDD1B; --white:#FFFFFF;

  --ink:#111111;                        /* text is black: the one colour outside the flag */
  --mute:rgba(17,17,17,.64);
  --faint:rgba(17,17,17,.4);
  --line:rgba(2,75,143,.11);
  --wash:rgba(2,75,143,.045);           /* calm surfaces */
  --sun:#FFF8D1;                        /* flag yellow at 20% on white, flattened: opaque */
  --bg:#FFFFFF;

  /* asymmetric radii: big, big, big, small */
  --r-panel:30px 30px 30px 8px;
  --r-hero:40px 12px 40px 12px;
  --r-field:14px 14px 14px 5px;
  --r-btn:999px 999px 999px 9px;
  --r-pill:999px;

  --shadow:0 22px 44px -30px rgba(2,75,143,.42);
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --font:"Work Sans",-apple-system,"Segoe UI",sans-serif;
  --display:"Archivo","Work Sans",sans-serif;
  --pad:20px; --gap:24px;
}
/* ========================================================= */
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:420 14px/1.55 var(--font)}
a{color:inherit}

/* poster layer */
.poster{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
/* bg.jpg is 2752x1536, so at 100vh tall it is 179.2vh wide; the hibiscus's right edge is at 49.2% = 88.2vh.
   The first card starts at 96vw - 880px. Tuck the flower 30px under it, and never open a gap on the left. */
.bg{position:absolute;top:0;height:100vh;width:auto;max-width:none;
  left:min(0px, calc(96vw - 850px - 88.2vh))}
.accent{position:absolute;right:0;bottom:0;width:min(19vw,330px);height:auto}
/* No page-wide grain layer: the art carries its own grain, and noise on the white paper reads as dirt.
   No blend modes or SVG filters on fixed layers either: they repaint the whole screen on every scroll. */
.tag{position:fixed;left:3vw;bottom:5vh;z-index:2;background:var(--yellow);color:var(--ink);
  font:600 10.5px/1.3 var(--mono);letter-spacing:.04em;text-transform:uppercase;
  writing-mode:vertical-rl;transform:rotate(180deg);padding:14px 10px;max-height:46vh;
  border-radius:16px 16px 4px 16px}
.tag b{font-weight:800}

/* page */
.wrap{position:relative;z-index:2;max-width:880px;margin:0 4vw 0 auto;padding:30px 0 64px}
@media (max-width:1100px){.wrap{margin:0 auto;padding:24px 18px 56px}.bg,.accent{opacity:.22}.tag{display:none}}

header{margin:0 0 28px}
header .mark{display:flex;align-items:center;gap:16px}
header .logo{width:200px;height:auto;display:block;margin:-4px 0 -4px -10px}
header .title{display:flex;flex-direction:column;gap:9px}
header b{font:900 52px/.9 var(--display);font-stretch:112%;letter-spacing:-.04em;color:var(--ink)}
header .with{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
header .with i{font:700 21px/1 var(--display);font-stretch:125%;font-style:normal;letter-spacing:-.01em;
  color:var(--red);margin:0 8px 2px 2px}
header .name{display:inline-block;font:800 14px/1 var(--display);font-stretch:108%;letter-spacing:0;
  padding:8px 14px 9px;border-radius:999px 999px 999px 7px}
header .n1{background:var(--blue);color:var(--white);transform:rotate(-4deg)}
header .n2{background:var(--red);color:var(--white);transform:rotate(3deg) translateY(3px)}
header .n3{background:var(--yellow);color:var(--blue);transform:rotate(-2deg) translateY(-1px)}
header .rule{height:4px;margin-top:18px;border-radius:999px;
  background:linear-gradient(90deg,var(--blue) 0 34%,var(--yellow) 34% 46%,var(--line) 46% 100%)}

h2{font:700 10.5px/1.2 var(--display);font-stretch:112%;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
.cols{display:flex;gap:var(--gap);align-items:flex-start}
.cols>.main{flex:1 1 57%;min-width:0}
.cols>.side{flex:1 1 43%;min-width:0}

/* surfaces */
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r-panel);
  padding:var(--pad);box-shadow:var(--shadow)}
.card{background:var(--white);border:1px solid var(--line);border-radius:22px 22px 22px 6px;
  padding:13px 15px;margin-bottom:10px}
.card b{font-size:14px}
.card p{margin:3px 0 8px;font-size:12.5px;color:var(--mute)}

/* the one card that matters */
.turn,.act{background:var(--sun);border:1px solid rgba(254,221,27,.75);border-radius:var(--r-hero);
  padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow)}
.turn.calm,.act.calm{background:var(--white);border:1px solid var(--line)}
.turn .k,.act .k{font:700 10.5px/1.2 var(--display);font-stretch:112%;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.turn.calm .k,.act.calm .k{color:var(--mute)}
.turn .v,.act .v{font:800 22px/1.15 var(--display);font-stretch:104%;margin:8px 0 6px;letter-spacing:-.02em;color:var(--ink)}
.turn .d,.act .d{font-size:13.5px;color:var(--mute)}
.howto{margin:14px 0 0;padding-left:20px;font-size:13.5px;line-height:1.65}
.howto li{margin-bottom:6px}
.howto li::marker{color:var(--ink);font-weight:800}
.pre{background:var(--white);border:1px solid var(--line);border-radius:16px 16px 16px 5px;
  padding:12px 14px;margin-top:12px;font-size:12.5px;line-height:1.6}
.pre table{width:100%;border-collapse:collapse}
.pre td{padding:3px 0;vertical-align:top}
.pre td:first-child{color:var(--mute);width:40%;padding-right:10px;font-size:11.5px}
.acts{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap}
.warn{margin:12px 0 0;font-size:12.5px;color:var(--red);font-weight:600}

/* form */
label{display:block;font:700 10.5px/1.2 var(--display);font-stretch:112%;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 7px}
.field{margin-bottom:14px}
input,select{width:100%;border:1px solid rgba(2,75,143,.2);border-radius:var(--r-field);padding:10px 13px;
  font:inherit;font-size:13.5px;background:var(--white);color:var(--ink);transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--faint)}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(254,221,27,.45)}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--wash);border-radius:var(--r-pill)}
.seg button{border:0;background:transparent;padding:7px 16px;font:650 12.5px/1.2 var(--display);font-stretch:106%;
  color:var(--mute);cursor:pointer;border-radius:var(--r-pill);transition:background .15s,color .15s}
.seg button.on{background:var(--blue);color:var(--white);font-weight:600}

/* buttons */
.btn{border:1px solid var(--blue);background:var(--blue);color:var(--white);border-radius:var(--r-btn);
  padding:10px 20px;font:600 13.5px/1.2 var(--font);cursor:pointer;text-decoration:none;
  display:inline-block;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--white);color:var(--ink);border-color:rgba(2,75,143,.25)}
.btn.sm{padding:7px 15px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* plan preview */
.plan{font-size:13px}
.plan div{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.plan div:last-child{border-bottom:0}
.plan .why{color:var(--mute);font-size:11.5px;margin-left:auto;text-align:right}
.plan s{color:var(--faint)}

/* step list */
.steps{font-size:13.5px}
.steps .row{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.steps .row:last-child{border-bottom:0}
.steps em{font-style:normal;color:var(--mute);font-size:12px;display:block}
.ico{width:16px;height:16px;border-radius:50%;flex:none;margin-top:2px;border:1.5px solid var(--line);
  background:var(--white);display:flex;align-items:center;justify-content:center;color:var(--white);font-size:9px}
.ico.done{background:var(--blue);border-color:var(--blue)}
.ico.now{border:2.5px solid var(--blue)}
.ico.open{background:rgba(2,75,143,.16);border-color:transparent}

/* small things */
.chip{display:inline-block;background:var(--wash);border-radius:var(--r-pill);padding:2px 10px;
  font-size:10.5px;color:var(--mute);margin:0 4px 4px 0}
.chip.red{background:rgba(218,51,43,.1);color:var(--red)}
.doc{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);text-decoration:none}
.doc:last-child{border-bottom:0}
.new{background:rgba(218,51,43,.1);color:var(--red);border-radius:var(--r-pill);padding:1px 8px;font-size:10px;height:fit-content}
.link{background:var(--wash);border-radius:16px 16px 16px 5px;padding:11px 14px;font-size:12.5px;word-break:break-all;margin:12px 0}
.muted{color:var(--mute);font-size:12.5px}
.hide{display:none}
.fn{font-size:11.5px;color:var(--mute);font-weight:400;margin-left:6px}

/* ---------- the new hire's page: the journey ---------- */
.row{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.row em{font-style:normal;color:var(--mute);font-size:12px;display:block}
.tk{font:500 11.5px/1 var(--mono)}
.journey{padding:24px 26px 18px}
.hello .k{font:700 10.5px/1.2 var(--display);font-stretch:112%;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.hello h1{font:900 32px/1.02 var(--display);font-stretch:108%;letter-spacing:-.035em;margin:9px 0 6px;text-wrap:balance}
.hello p{margin:0;color:var(--mute)}
.main.panel .hello{margin-bottom:18px}
.act{padding:18px 20px;margin:8px 0 10px;border-radius:30px 10px 30px 10px}
.flat{max-width:720px}
.flat h2{margin:4px 0 4px}

/* the new hire's steps: collapsed by default, highlighted so they are easy to see */
.mine{margin:6px 0;background:var(--sun);border:1px solid rgba(254,221,27,.9);border-radius:22px 22px 22px 6px}
.rh{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:11px;align-items:center;width:100%;padding:11px 14px;font-size:13.5px}
.rh:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:22px}
.rh .t{flex:1;min-width:0}
.rh em{font-style:normal;color:var(--mute);font-size:12px;display:block}
.pill{font:700 10px/1 var(--display);font-stretch:112%;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
  background:var(--blue);color:var(--white);padding:6px 10px;border-radius:999px 999px 999px 4px}
.chev{width:8px;height:8px;flex:none;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);margin:0 4px 4px 2px}
.mine.open .chev{transform:rotate(-135deg);margin:4px 4px 0 2px}
.mine .act{margin:0;padding:2px 18px 16px 41px;background:transparent;border:0;box-shadow:none;border-radius:0}

/* stepper: the one place with colour. Done = navy check, here = red node + "You are here". */
.stepper{list-style:none;margin:22px 0 22px;padding:0;display:grid;grid-template-columns:repeat(var(--n),1fr)}
.stepper li{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.stepper li+li::before{content:"";position:absolute;top:17px;right:calc(50% + 24px);left:calc(-50% + 24px);height:3px;
  border-radius:999px;background:var(--line)}
.stepper li.done+li::before{background:var(--blue)}
.node{position:relative;z-index:1;width:36px;height:36px;display:grid;place-items:center;border-radius:13px 13px 13px 4px;
  font:800 14px/1 var(--display);color:var(--faint);background:var(--white);border:1.5px solid rgba(2,75,143,.2)}
.stepper li.done .node{background:var(--blue);border-color:var(--blue);color:var(--white)}
.stepper li.here .node{background:var(--red);border-color:var(--red);color:var(--white);box-shadow:0 0 0 6px rgba(218,51,43,.14)}
.lab{font:800 13.5px/1.2 var(--display);font-stretch:104%;color:var(--mute)}
.stepper li.done .lab,.stepper li.here .lab{color:var(--ink)}
.sub{font:700 10px/1 var(--display);font-stretch:112%;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.stepper li.done .sub{color:var(--mute)}
.you{display:inline-block;background:var(--red);color:var(--white);padding:4px 9px 4px;border-radius:999px 999px 999px 4px}
@keyframes pop{0%{transform:scale(.55)}55%{transform:scale(1.28)}100%{transform:scale(1)}}
.node.pop{animation:pop .6s cubic-bezier(.2,.9,.25,1.3)}

/* ---------- while you wait: one container ---------- */
.stack>*+*{margin-top:16px}
.explore{padding:22px 24px 18px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.ex-head h2{margin:0 0 6px}
.hook{margin:0;font-size:14px;max-width:520px}
.arrows{display:flex;gap:6px}
.arrows button{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;
  border:1px solid rgba(2,75,143,.25);font:800 14px/1 var(--display);color:var(--ink)}
.arrows button:hover{border-color:var(--blue)}
.car{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,calc((100% - 24px) / 2.6));gap:12px;
  overflow-x:auto;scroll-snap-type:x mandatory;margin:16px -24px 0;padding:2px 24px 14px;scroll-padding:0 24px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.pc{scroll-snap-align:start;display:flex;flex-direction:column;gap:9px;padding:16px 16px 14px;
  background:var(--white);border:1px solid rgba(2,75,143,.16);border-radius:24px 24px 24px 6px}
.pc-top{display:flex;align-items:center;gap:8px;min-height:30px}
.ini{width:30px;height:30px;flex:none;border-radius:10px 10px 10px 4px;display:grid;place-items:center;
  font:800 13px/1 var(--display);color:var(--white);background:var(--blue)}
.ini.c1,.ini.c4{background:var(--red)} .ini.c2{background:var(--yellow);color:var(--ink)} .ini.c3{background:var(--blue)}
.pc .chip{margin:0;padding:1px 8px;font:700 9.5px/1.6 var(--display);letter-spacing:.06em;text-transform:uppercase;
  background:transparent;border:1px solid rgba(2,75,143,.25);color:var(--ink)}
.pc-name{font:850 19px/1.1 var(--display);font-stretch:104%;letter-spacing:-.015em}
.pc p{margin:0;font-size:13px;line-height:1.5}
.pc .try{color:var(--mute)}
.pc-foot{margin-top:auto;display:flex;justify-content:flex-end;align-items:center;gap:10px;padding-top:11px;border-top:1px solid var(--line)}
.pc .poc{font-size:12.5px;color:var(--mute)}
.pc .poc b{color:var(--ink);font-weight:600}
.pc .poc a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.links{display:flex;gap:12px;font:700 12.5px/1 var(--display)}
.links a{text-decoration:none;border-bottom:1.5px solid var(--blue);padding-bottom:2px}
/* the quiz is not a product: tinted, dashed, mirrored corners */
.quizcard{display:flex;align-items:center;gap:14px;margin-top:6px;padding:15px 18px;background:var(--wash);
  border:1.5px dashed rgba(2,75,143,.32);border-radius:10px 28px 10px 28px}
.qi{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:14px 14px 14px 4px;
  background:var(--blue);color:var(--white);font:900 20px/1 var(--display)}
.quizcard .t{flex:1;min-width:0}
.quizcard b{display:block;font:850 16px/1.2 var(--display);font-stretch:104%}
.quizcard em{font-style:normal;font-size:12.5px;color:var(--mute)}

/* ---------- achievements ---------- */
.toast{position:fixed;left:50%;bottom:28px;z-index:60;transform:translate(-50%,28px) scale(.96);opacity:0;
  display:flex;gap:12px;align-items:center;max-width:540px;padding:13px 20px 13px 13px;
  background:var(--blue);color:var(--white);font-size:13.5px;border-radius:22px 22px 22px 6px;
  box-shadow:0 26px 50px -24px rgba(2,75,143,.65);transition:transform .4s cubic-bezier(.2,.9,.25,1.25),opacity .25s}
.toast.in{transform:translate(-50%,0) scale(1);opacity:1}
.toast b{font-family:var(--display);font-weight:800}
.badge{width:36px;height:36px;flex:none;border-radius:12px 12px 12px 4px;background:var(--yellow);color:var(--ink);
  display:grid;place-items:center;font:900 16px/1 var(--display)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.finish{padding:24px 26px 20px}
@keyframes rise{0%{transform:translateY(26px) scale(.85);opacity:0}100%{transform:none;opacity:1}}
.finish .k{font:700 10.5px/1.2 var(--display);font-stretch:112%;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.finish h1{font:900 38px/1 var(--display);font-stretch:108%;letter-spacing:-.035em;margin:9px 0 8px}
.next{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 8px}
.nx{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start;padding:15px 14px 14px;border-radius:24px 24px 24px 6px;
  animation:rise .7s cubic-bezier(.2,.9,.25,1.2) both;transition:transform .15s}
.nx:hover{transform:translateY(-2px)}
.nx:nth-child(2){animation-delay:.12s} .nx:nth-child(3){animation-delay:.24s}
.nx small{display:block;font:700 9.5px/1 var(--display);font-stretch:112%;letter-spacing:.1em;text-transform:uppercase;opacity:.8;margin-bottom:9px}
.nx b{display:block;font:850 15.5px/1.15 var(--display);letter-spacing:-.01em;margin-bottom:6px}
.nx span{display:block;font-size:12px;line-height:1.4;opacity:.85}
.nx{background:var(--white);color:var(--ink);border:1px solid rgba(2,75,143,.18)}
.nx:first-child{border-color:var(--blue)}
.more{all:unset;cursor:pointer;font:700 12.5px/1 var(--display);border-bottom:1.5px solid var(--blue);padding-bottom:2px;margin-top:6px}
@media (prefers-reduced-motion: reduce){.nx,.node.pop{animation:none}}

/* ---------- header: name of the app, tour button ---------- */
header .kicker{font:700 10.5px/1 var(--display);font-stretch:112%;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:-2px}

/* ---------- tour ---------- */
.tour-card{display:none;position:fixed;z-index:82;width:370px;padding:18px 20px 16px 20px;background:var(--white);color:var(--ink);
  border:1px solid rgba(2,75,143,.14);border-radius:28px 28px 28px 8px;box-shadow:0 30px 60px -26px rgba(10,16,51,.55);
  }
.tour-card.on{display:block}
.tour-card.in{animation:cardin .4s cubic-bezier(.2,.9,.25,1.2)}
@keyframes cardin{0%{opacity:0;transform:translateY(10px) scale(.97)}100%{opacity:1;transform:none}}
.tour-card .face{position:absolute;left:-14px;top:-46px;width:84px;height:84px;filter:drop-shadow(0 10px 14px rgba(10,16,51,.25));
  animation:bob .5s cubic-bezier(.2,.9,.25,1.4)}
@keyframes bob{0%{transform:translateY(14px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
.tour-card .faces{position:absolute;left:-8px;top:-50px;display:flex}
.tour-card .faces img{width:74px;height:74px;margin-right:-18px;filter:drop-shadow(0 10px 14px rgba(10,16,51,.25));animation:bob .5s cubic-bezier(.2,.9,.25,1.4) both}
.tour-card .faces img:nth-child(2){animation-delay:.08s} .tour-card .faces img:nth-child(3){animation-delay:.16s}
.tour-card .who{display:flex;align-items:baseline;gap:8px;margin:10px 0 6px 64px}
.tour-card .faces~.who{margin-left:0;margin-top:22px}
.tour-card .who b{font:850 16px/1 var(--display);font-stretch:104%}
.tour-card .who span{font:700 10px/1 var(--display);font-stretch:112%;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.tour-card p{margin:0;font-size:15px;line-height:1.5}
.tour-card p small{display:block;margin-top:6px;font-size:11.5px;color:var(--mute)}
.tour-ctl{display:flex;align-items:center;gap:8px;margin-top:14px}
.tour-ctl .count{font:500 11.5px/1 var(--mono);color:var(--mute);margin-right:auto}
.tour-ctl .dots{display:flex;gap:5px;margin-right:auto}

.tour-card[data-tail="down"]::before{bottom:-7px}

</style></head>
<body>
<div class="poster" aria-hidden="true"><img class="bg" src="/brand/bg.jpg?v=6" alt=""><img class="accent" src="/brand/accent.png?v=6" alt=""></div>
<div class="tag"><b>KopiCode 2026 presents</b><br>Day One: onboarding<br>Ali &middot; Muthu &middot; Ah Hock<br>13/11/26</div>
<div class="wrap">
<header>
  <div class="mark">
    <img class="logo" src="/brand/logo-420.png?v=6" alt="Ali, Muthu and Ah Hock">
    <div class="title">
      <span class="kicker">GTech new-hire onboarding</span>
      <b>Day&nbsp;One</b>
      <div class="with"><i>with</i><span class="name n1">Ali</span><span class="name n2">Muthu</span><span class="name n3">Ah&nbsp;Hock</span></div>
    </div>
  </div>
  <div class="rule"></div>
</header>
<div id="app"></div>
</div>
<script>
const $ = s => document.querySelector(s);
/* Short forms, with what they are. GSD's long form is confirmed in GT repos; GEMS and GES are
   described by what they do until the official names are confirmed. */
const FULL = {gems:"SAP SuccessFactors", ges:"HR information system", gsd:"Gamuda Service Desk",
              atlassian:"Jira and Confluence", gcp:"Google Cloud", claude_seat:"AI coding assistant"};
const fullName = (id, title) => FULL[id] ? `${esc(title)} <span class="fn">${FULL[id]}</span>` : esc(title);
const GAMUDA = /^[^@\s]+@(gamuda\.com\.my|gamuda\.tech)$/i;   // only Gamuda staff start onboarding
const api = (p, o) => fetch("/api" + p, o).then(r => r.json());
let F = {employment:"staff", job_family:"developer", project:"odin", want_claude:true};
let PROJECTS = {}, TIMER = null, DIR = null, LAST = "";

const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* Malaysian names: never take the first word blindly. "Lim Wei Jie" starts with the family name,
   so keep the whole name, and stop only at bin / binti / a/l / a/p / s/o / d/o. */
const callName = n => (n||"").split(/\s+(?:binti|bin|bte|bt|a\/l|a\/p|s\/o|d\/o)\s+/i)[0].trim();

async function boot(){
  PROJECTS = await api("/projects");
  const m = location.pathname.match(/^\/n\/(.+)$/);
  if (m) { watch(m[1]); } else { renderForm(); }
}

/* ---------- the form ---------- */
function renderForm(){
  const opts = Object.keys(PROJECTS).sort().map(k =>
    `<option value="${k}" ${k===F.project?"selected":""}>${k}</option>`).join("");
  $("#app").innerHTML = `
  <div class="cols">
    <div class="main panel">
      <div class="hello"><div class="k">For Gamuda staff</div><h1>Add a new hire</h1>
        <p>Day One sends each access request to IT, in order.</p></div>
      <div class="field"><label>New hire's full name</label><input id="name" placeholder="Nurul Aina binti Rahim"></div>
      <div class="field"><label>Your Gamuda email</label>
        <input id="starter" placeholder="you@gamuda.com.my"></div>
      <div class="field"><label>Type of hire</label>
        <div class="seg" id="seg-emp">
          <button data-v="staff">Staff</button><button data-v="intern">Intern</button></div></div>
      <div class="field"><label>Role</label>
        <div class="seg" id="seg-job">
          <button data-v="developer">Developer</button><button data-v="other">Non-developer</button></div></div>
      <div class="field"><label>Project (optional)</label>
        <select id="project"><option value="">No project yet</option>${opts}</select></div>
      <div class="field"><label>Start date (optional)</label><input id="start" placeholder="17-11-2026"></div>
      <button class="btn" id="go">Start onboarding</button>
      <div id="err" class="muted" style="margin-top:9px"></div>
    </div>
    <div class="side panel">
      <h2>Steps for this new hire</h2>
      <div id="plan" class="plan"></div>
    </div>
  </div>`;
  bindSeg("#seg-emp", "employment"); bindSeg("#seg-job", "job_family");
  $("#project").onchange = e => { F.project = e.target.value; preview(); };
  $("#go").onclick = submit;
  preview().then(() => say("start"));
}
function bindSeg(sel, key){
  const box = $(sel);
  [...box.children].forEach(b => {
    b.classList.toggle("on", b.dataset.v === F[key]);
    b.onclick = () => { F[key] = b.dataset.v;
      [...box.children].forEach(x => x.classList.toggle("on", x === b)); preview().then(() => say("type")); };
  });
}
async function preview(){
  const q = new URLSearchParams({employment:F.employment, job_family:F.job_family,
                                 want_claude:F.want_claude});
  if (F.project) q.set("project", F.project);
  const p = await api("/preview?" + q);
  const chan = {gsd_auto:"GSD ticket", slack_guided:"Slack form", self:"new hire", person:"team contact"};
  $("#plan").innerHTML =
    p.steps.map(s => `<div><span>${fullName(s.id, s.title)}</span><span class="why">${chan[s.channel]}</span></div>`).join("")
    + p.skipped.map(s => `<div><s>${esc(s.title)}</s><span class="why">${esc(s.why)}</span></div>`).join("")
    + `<div style="border:0;padding-top:9px"><b>${p.steps.length} steps</b>
       <span class="why">${p.skipped.length} not needed</span></div>`;
}
async function submit(){
  const name = $("#name").value.trim(), starter = $("#starter").value.trim();
  if (!name || !starter) { $("#err").textContent = "Type the name of the new hire and your work email."; return; }
  if (!GAMUDA.test(starter)) { $("#err").textContent = "Use your Gamuda work email. Only Gamuda staff can start onboarding."; return; }
  $("#go").disabled = true;
  const v = await api("/onboardings", {method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({name, starter_email:starter, employment:F.employment,
      job_family:F.job_family, project:F.project||null, start_date:$("#start").value.trim()})});
  STARTED = v.token;
  const url = location.origin + "/n/" + v.token;
  $("#app").innerHTML = `<div class="panel" style="max-width:560px">
    <h2>Onboarding started</h2>
    <div class="turn"><div class="k">Sent to IT</div>
      <div class="v">First request sent</div>
      <div class="d">${v.progress.total - 1} more steps follow, one by one.</div></div>
    <p class="muted">Send this link to ${esc(callName(name))}. No password is necessary.</p>
    <div class="link">${url}</div>
    <div class="acts"><button class="btn" onclick="openHire('${v.token}')">Open the new hire's page</button>
    <button class="btn ghost sm" onclick="navigator.clipboard.writeText('${url}')">Copy link</button></div>
  </div>`;
  say("started");
}

/* ---------- the new hire's page ---------- */
/* Four stages, shown in the stepper. The steps are one flat list. */
const STAGES = [
  {key:"account", name:"Account",          blurb:"Your Gamuda email and your own password", ids:["email","password_reset"]},
  {key:"hr",      name:"HR and help desk", blurb:"GEMS, GES and the GSD portal",            ids:["gems","ges","gsd"]},
  {key:"tools",   name:"Work tools",       blurb:"Slack, Atlassian, Bitbucket, Claude Code", ids:["slack","atlassian","bitbucket","claude_seat"]},
  {key:"project", name:"Your project",     blurb:"GCP access and the repo",                 ids:["gcp","repo_access"]},
];
const NEXT_TIP = {
  account: "Day One now asks IT for GEMS (SAP SuccessFactors), GES (the HR information system) and GSD (Gamuda Service Desk) access.",
  hr:      "The new hire can now raise their own GSD tickets. Day One asks for Slack, Atlassian (Jira and Confluence) and Bitbucket.",
  tools:   "Slack and Bitbucket are ready. Last stage: GCP (Google Cloud) access and the repo.",
  project: "All access is ready.",
};
let TOKEN = "", V = null, TOGGLE = {}, EXP = new Set(), FIRST = true;
const mem = {
  get: k => { try { return JSON.parse(localStorage.getItem(`dayone:${TOKEN}:${k}`)); } catch(e){ return null; } },
  set: (k, v) => { try { localStorage.setItem(`dayone:${TOKEN}:${k}`, JSON.stringify(v)); } catch(e){} },
};
function openHire(token){ history.pushState({}, "", "/n/" + token); LAST = ""; watch(token); }
function watch(token){
  TOKEN = token;
  const tick = async () => { try { await render(await api("/n/" + token), token); } catch(e){ console.warn(e); } };
  tick();
  clearInterval(TIMER); TIMER = setInterval(tick, 1500);
}
const rerender = () => { LAST = ""; if (V) render(V, TOKEN); };

function stagesOf(v){
  const byId = Object.fromEntries(v.steps.map(s => [s.id, s]));
  const list = STAGES.map(g => ({...g, steps: g.ids.map(i => byId[i]).filter(Boolean)})).filter(g => g.steps.length);
  list.forEach(g => {
    g.done = g.steps.filter(s => s.state === "done").length;
    g.complete = g.done === g.steps.length;
    g.withIT = g.steps.filter(s => s.state === "open").length;
    g.mine = g.steps.some(s => s.state === "waiting_person" || (s.state === "waiting_user" && !s.held_by.length));
  });
  const here = list.find(g => !g.complete);
  list.forEach(g => { g.here = g === here; g.open = g.key in TOGGLE ? TOGGLE[g.key] : (g.here || g.mine); });
  return list;
}
const CH = {
  self:   {k:"Your turn", act:"I have done this"},
  slack_guided:{k:"Your turn &middot; in Slack, not GSD", act:"I have sent the form"},
  person: {k:"Your turn &middot; ask your team contact", act:"I have access now"},
};
function act(v, t, inRow){
  const c = (t.then_self && t.state === "waiting_user") ? {k:"Your turn &middot; IT gave you access", act:"I have signed in"} : (CH[t.channel] || CH.self);
  const n = v.your_turn_count || 1;
  const fields = (t.fields||[]).length ? `<div class="pre"><table>${
      t.fields.map(f => `<tr><td>${esc(f.label)}</td><td>${esc(f.value)}</td></tr>`).join("")}</table></div>` : "";
  const howto = (t.howto||[]).length ? `<ol class="howto">${t.howto.map(h => `<li>${esc(h)}</li>`).join("")}</ol>` : "";
  const ask = t.ask ? `<div class="pre">${esc(t.ask)}</div>` : "";
  const emailAsk = t.ask_email ? `<div class="pre">
      <label>Your sign-in email</label>
      <input id="we" value="${esc(v.guess_email)}">
      <span class="muted">Made from your name. Change it if it is wrong.</span></div>` : "";
  const copy = (t.fields||[]).length ? t.fields.map(f => f.label + ": " + f.value).join("\n") : t.ask;
  const exp = t.id === "password_reset" && v.link_expires_in_hours !== null
    ? (v.link_expires_in_hours > 0
        ? `<p class="warn">The sign-in link stops working in ${Math.floor(v.link_expires_in_hours)} hours.</p>`
        : `<p class="warn">The sign-in link does not work now. Ask the person who started your onboarding to raise a GSD ticket. IT then resets your account.</p>`) : "";
  return `<div class="act ${t.channel==="person"?"calm":""}">
    ${inRow ? "" : `<div class="k">${c.k}${n > 1 ? ` &middot; 1 of ${n}` : ""}</div><div class="v">${esc(t.title)}</div>`}
    <div class="d">${esc(t.hint || "")}</div>
    ${howto}${fields}${ask}${emailAsk}${exp}
    ${t.id==="password_reset" ? '<p class="muted" style="margin-top:9px">Day One does not see or keep your password.</p>' : ""}
    <div class="acts">
      <button class="btn sm" onclick="confirmStep('${TOKEN}','${t.id}')">${c.act}</button>
      ${copy ? `<button class="btn ghost sm" data-copy="${esc(copy)}" onclick="navigator.clipboard.writeText(this.dataset.copy)">Copy</button>`:""}
      ${t.channel==="person" && v.poc_email ? `<a class="btn ghost sm" href="mailto:${v.poc_email}">Email ${esc(v.poc_name)}</a>`:""}
    </div></div>`;
}
function row(v, s){
  const held = s.state === "waiting_user" && (s.held_by||[]).length;
  const mine = s.state === "waiting_person" || (s.state === "waiting_user" && !held);
  const ico = s.state==="done" ? '<span class="ico done">&#10003;</span>'
    : s.state==="open" || held ? '<span class="ico open"></span>'
    : mine ? '<span class="ico now"></span>' : '<span class="ico"></span>';
  const sub = s.state==="done" ? "Done"
    : s.state==="open" ? `With IT &middot; <span class="tk">GSD #${s.ticket_id}</span> &middot; about ${s.eta_days} days`
    : held ? `IT gave access &middot; starts after: ${esc(s.held_by.join(", "))}`
    : s.state==="waiting_user" ? "Open to see what to do"
    : s.state==="waiting_person" ? `${esc(v.poc_name)} adds you. Open for the message.`
    : "Starts after: " + esc(s.blocked_by.join(", "));
  if (!mine) return `<div class="row" data-state="${s.state}">${ico}<span>${fullName(s.id, s.title)}<em>${sub}</em></span></div>`;
  /* the new hire's steps start collapsed: a highlighted row that the new hire opens */
  const open = EXP.has(s.id);
  return `<div class="mine ${open ? "open" : ""}" data-id="${s.id}">
    <button class="rh" data-step="${s.id}">${ico}<span class="t">${fullName(s.id, s.title)}<em>${sub}</em></span>
      <span class="pill">Your turn</span><span class="chev"></span></button>
    ${open ? act(v, s, true) : ""}
  </div>`;
}
function journey(v, list){
  const n = v.your_turn_count || 0;
  const withIT = v.steps.filter(x => x.state === "open").length;
  const h1 = n ? (n > 1 ? `You have ${n} steps to do` : "You have 1 step to do")
    : withIT ? `IT is working on ${withIT} request${withIT>1?"s":""}` : "Almost there";
  const p = n ? "Open the yellow step below." : "Nothing to do now. IT is working on it.";
  return `<section class="journey panel">
    <div class="hello"><div class="k">Welcome to Gamuda Technologies, ${esc(callName(v.name))}</div><h1>${h1}</h1><p>${p}</p></div>
    ${stepper(list)}
    ${flatList(v)}
  </section>`;
}
function stepper(list){
  return `<ol class="stepper" style="--n:${list.length}">${list.map((g, i) => `
    <li class="${g.complete ? "done" : g.here ? "here" : ""}" data-key="${g.key}">
      <span class="node">${g.complete ? "&#10003;" : i + 1}</span>
      <span class="lab">${esc(g.name)}</span>
      <span class="sub">${g.complete ? "Done" : g.here ? '<span class="you">You are here</span>' : `${g.done} of ${g.steps.length} done`}</span>
    </li>`).join("")}</ol>`;
}
function flatList(v){
  return `<div class="flat">
    <h2>All steps &middot; ${v.progress.done} of ${v.progress.total} done</h2>
    ${v.steps.map(x => row(v, x)).join("")}
    ${v.work_email ? `<p class="muted" style="margin:12px 0 0">Your work email: <b>${esc(v.work_email)}</b></p>` : ""}
  </div>`;
}
function finish(v, list, d){
  const mine = d.find(x => x.key === (v.project||"").toLowerCase());
  return `<section class="finish panel">
    <div class="k">Onboarding complete</div>
    <h1>You are ready, ${esc(callName(v.name))}.</h1>
    <p class="muted">All ${v.progress.total} steps are done. Start here:</p>
    ${stepper(list)}
    <div class="next">
      ${mine ? `<a class="nx" href="${mine.docs_url || mine.url}" target="_blank"><small>Your project</small><b>Start on ${esc(mine.name)}</b><span>Ask ${esc(mine.poc_name)} for your first task.</span></a>` : ""}
      <button class="nx" data-quiz="1"><small>Two minutes</small><b>Take the GTech quiz</b><span>See how much you know.</span></button>
      <button class="nx" data-explore="${(d.find(x => !mine || x.key !== mine.key) || d[0]).key}"><small>Read</small><b>Learn about the other products</b><span>${d.length} products, below.</span></button>
    </div>
    <button class="more" data-stage="__all">${TOGGLE.__all ? "Hide" : "See"} all ${v.progress.total} steps</button>
    ${TOGGLE.__all ? flatList(v) : ""}
  </section>`;
}
function explore(v, d){
  const open = v.steps.filter(x => x.state === "open");
  const eta = Math.max(0, ...open.map(x => x.eta_days || 0));
  const mine = d.find(x => x.key === (v.project||"").toLowerCase());
  const list = mine ? [mine, ...d.filter(x => x !== mine)] : d;
  const ready = v.progress.done === v.progress.total;
  const hook = !ready && open.length
    ? `IT is working on ${open.length} request${open.length>1?"s":""}. Meanwhile, learn about GTech products.`
    : "Learn about GTech products.";
  return `<section class="panel explore" id="explore">
    <div class="ex-head">
      <div><h2>${ready ? "Next for you" : "While you wait"}</h2><p class="hook">${hook}</p></div>
      <div class="arrows"><button data-car="-1" aria-label="Previous">&larr;</button><button data-car="1" aria-label="Next">&rarr;</button></div>
    </div>
    <div class="car" id="car">${list.map((x, i) => `
      <article class="pc" data-card="${x.key}">
        <div class="pc-top"><span class="ini c${i % 5}">${esc(x.name[0])}</span>
          ${mine && x.key===mine.key ? '<span class="chip">your project</span>' : ""}</div>
        <b class="pc-name">${esc(x.name)}</b>
        <p>${esc(x.one_line||"")}</p>
        ${x.try_in_5 ? `<p class="try"><b>Try in 5 minutes:</b> ${esc(x.try_in_5)}</p>` : ""}
        <p class="poc">Contact <b>${esc(x.poc_name)}</b>${x.poc_email ? `<br><a href="mailto:${x.poc_email}">${esc(x.poc_email)}</a>` : ""}</p>
        <div class="pc-foot"><span class="links"><a href="${x.url}" target="_blank">Open &rarr;</a>${x.docs_url ? `<a href="${x.docs_url}" target="_blank">Docs &rarr;</a>` : ""}</span></div>
      </article>`).join("")}
    </div>
    <div class="quizcard">
      <span class="qi">?</span>
      <span class="t"><b>GTech quiz</b><em>Two minutes. Test what you know about GTech.</em></span>
      <button class="btn sm" data-quiz="1">Start the quiz &rarr;</button>
    </div>
  </section>`;
}
async function confirmStep(token, step){
  const el = document.querySelector("#we");
  await render(await api(`/n/${token}/steps/${step}/confirm`, {method:"POST",
    headers:{"content-type":"application/json"},
    body: JSON.stringify({work_email: el ? el.value.trim() : ""})}), token);
}
/* Polling runs every 1.5 s. Build the whole screen as one string and touch the DOM only when that
   string changes: no empty column between polls, no lost hover, no reset of typed text. */
async function render(v, token){
  if (!DIR) DIR = await api("/directory");
  V = v;
  const list = stagesOf(v);
  const done = v.progress.done === v.progress.total;
  const html = `<div class="stack">
    ${done ? finish(v, list, DIR) : journey(v, list)}
    ${explore(v, DIR)}
  </div>`;
  if (html !== LAST) {
    const we = $("#we"), typed = we ? we.value : null, focused = we && document.activeElement === we;
    const car = $("#car"), carX = car ? car.scrollLeft : 0;
    LAST = html;
    $("#app").innerHTML = html;
    if ($("#car")) $("#car").scrollLeft = carX;
    const we2 = $("#we");
    if (we2 && typed !== null) { we2.value = typed; if (focused) we2.focus(); }
  }
  celebrate(list, done);
  events(v, list, done);
}
/* ---------- achievements ---------- */
function celebrate(list, done){
  const seen = new Set(mem.get("celebrated") || []);
  const fresh = list.filter(g => g.complete && !seen.has(g.key));
  const allFresh = done && !seen.has("__all");
  if (!fresh.length && !allFresh) { FIRST = false; return; }
  fresh.forEach(g => seen.add(g.key)); if (done) seen.add("__all");
  mem.set("celebrated", [...seen]);
  if (allFresh) {
    const h = document.querySelector(".finish h1"), r = h ? h.getBoundingClientRect() : {left:innerWidth/2, top:200, width:0};
    confetti(r.left + 160, r.top + 20, 180); setTimeout(() => confetti(innerWidth*0.75, innerHeight*0.35, 120), 350);
    FIRST = false; return;
  }
  const g = fresh[fresh.length - 1], i = list.indexOf(g), next = list[i + 1];
  const num = document.querySelector(`.stepper li[data-key="${g.key}"] .node`);
  if (num) { num.classList.add("pop"); const r = num.getBoundingClientRect(); confetti(r.left + r.width/2, r.top + r.height/2, 110); }
  say("stage:" + g.key, [`<b>${esc(g.name)} is done.</b>${next ? ` Next stage: ${esc(next.name)}.` : ""}`, NEXT_TIP[g.key] || ""].filter(Boolean));
  FIRST = false;
}
function toast(html){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = html;
  document.body.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add("in")));
  setTimeout(() => { t.classList.remove("in"); setTimeout(() => t.remove(), 400); }, 5600);
}
function confetti(x, y, n){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"), dpr = devicePixelRatio || 1;
  c.className = "confetti"; c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  document.body.appendChild(c);
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  const cols = ["#024B8F", "#DA332B", "#FEDD1B"];
  const P = Array.from({length: n}, () => { const a = -Math.PI/2 + (Math.random() - .5) * Math.PI * .95, sp = 5 + Math.random() * 9;
    return {x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
            w: 5 + Math.random() * 6, h: 3 + Math.random() * 3, c: cols[Math.floor(Math.random() * 3)]}; });
  const t0 = performance.now();
  (function frame(t){
    const k = (t - t0) / 1000; g.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => { p.vy += .3; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.globalAlpha = Math.max(0, 1 - k / 2.2);
      g.fillStyle = p.c; g.fillRect(-p.w/2, -p.h/2, p.w, p.h); g.restore(); });
    if (k < 2.2) requestAnimationFrame(frame); else c.remove();
  })(t0);
}
/* ---------- the guide: part of the app ----------
   An event in the app shows ONE message from one avatar, next to the part of the screen it is about.
   The message goes away when you do something, or when the next event replaces it.
   Each event shows one time only (kept in localStorage "dayone:seen"). No Next, no queue, no polling. */
const WHO = {
  ali:    {name:"Ali",     role:"The problem",       img:"/brand/av-ali.png"},
  muthu:  {name:"Muthu",   role:"How Day One helps", img:"/brand/av-muthu.png"},
  ahhock: {name:"Ah Hock", role:"How it works",      img:"/brand/av-ahhock.png"},
};
/* Each message can have several pages. The presenter (or the new hire) moves with Next or the arrow keys.
   Content from docs/PRD.md, written in ASD-STE100. */
const STEP_TXT = {
  password_reset: ["IT created the account. Now the new hire must do one thing: <b>open the yellow step</b> and set a password.",
                   "Google sends the sign-in link to the person who started the onboarding, not to the new hire. The link works for <b>48 hours</b> only, so Day One shows a countdown."],
  ges:            ["IT gave access to <b>GES</b>, the HR information system: role, employee details, KPI and leave. <b>Open the yellow step.</b>",
                   "GES sends a user ID and a temporary password to the work email. The user ID is the employee ID on the employee card."],
  gcp:            ["<b>GCP</b> (Google Cloud) access goes through Slack, not GSD. Many new hires do not know this. <b>Open the yellow step.</b>",
                   "In Slack, <b>/gcp-request</b> opens a form. Day One fills in the values of that form for you. Copy them, send the form, then confirm."],
  repo_access:    ["Bitbucket has no way to request repo access. A team contact must add the new hire. <b>Open the yellow step.</b>",
                   "Day One shows the contact for this project and writes the message. Send it. Confirm when you have access."],
};
const MSG = {
  start: {who:"ali", t:".side.panel", pages:[
    "Hello. We are Ali, Muthu and Ah Hock. This is <b>Day One</b>, the onboarding app for new hires at GTech. I am Ali. I explain the problem.",
    "Before a new hire can work, they need up to <b>11 accesses</b>: a Google Workspace email, the HR systems, GSD (Gamuda Service Desk), Slack, Atlassian, Bitbucket and more. Each access is a separate request.",
    "The requests must go in order. Each one waits for the one before it, and each one takes 3 to 5 days. <b>4 hand-offs &times; 3&ndash;5 days = 12 to 20 working days</b> before a new hire has all access.<small>Estimate from GT staff.</small>",
    "Today, a person must remember to raise each next request, in the correct channel. Nobody can see where the new hire is stuck. And the new hire does not know what GTech builds, or whom to ask."]},
  type: {who:"muthu", t:".side.panel", pages:[
    "I am Muthu. I show how Day One helps. The access depends on two things: the <b>type of hire</b> (staff or intern) and the <b>role</b> (developer or not).",
    "Interns do not get GEMS, GES or GSD, so they get 8 steps, not 11. Non-developers do not get Bitbucket, GCP or the repo. Day One knows these rules, so the buddy does not have to."]},
  started: {who:"muthu", t:".link", pages:[
    "Day One sent only the first request to IT: the Google Workspace email. The other requests wait in a queue. Day One sends each one when the step before it is done.",
    "The new hire gets one link to their own page. <b>No password is necessary</b>, because the new hire has no company account yet."]},
  page: {who:"muthu", t:".stepper", pages:[
    "This is the page of the new hire. The stepper shows the 4 stages: Account, HR and help desk, Work tools, Your project. <b>The red dot shows the stage now.</b>",
    "Day One checks each GSD ticket by itself, so nobody types status updates. When IT finishes a ticket, Day One sends the next request at once."]},
  finish: {who:"ahhock", t:".finish .stepper", pages:[
    "I am Ah Hock. I explain how Day One works. All access steps are in <b>one map</b>. Each step knows which steps must come first. The same map covers staff, interns, developers and non-developers.",
    "Each step has a channel: a GSD ticket, a Slack form, a task for the new hire, or a team contact. Day One sends each request through the correct channel.",
    "Day One creates each GSD ticket through the <b>Freshservice API</b>, the system behind GSD. This demo uses a local copy of that API, because a GSD user account cannot get an API key. One setting connects Day One to the real GSD.",
    {team:true, text:"Next: connect Day One to the real GSD, and add the GTech quiz. <b>From day one, every new hire knows the next step.</b> Thank you."}]},
};
const seen = () => new Set(JSON.parse(localStorage.getItem("dayone:seen") || "[]"));
const markSeen = id => { const x = seen(); x.add(id); localStorage.setItem("dayone:seen", JSON.stringify([...x])); };
let SHOWN = null, STARTED = "";
const isMine = x => x.state === "waiting_person" || (x.state === "waiting_user" && !(x.held_by||[]).length);

/* say(id): show message `id` if it was never shown. Stage and step messages pass their own pages. */
let PAGE = 0;
function say(id, pages){
  if (seen().has(id)) return;
  const base = MSG[id] || (id.startsWith("stage:") ? {who:"muthu", t:".stepper"}
    : id.startsWith("yellow:") ? {who:"muthu", t:`.mine[data-id="${id.slice(7)}"]`} : null);
  if (!base) return;
  markSeen(id);
  const p = pages || base.pages || STEP_TXT[id.slice(7)] || ["Your turn. <b>Open the yellow step.</b>"];
  show({...base, id, pages: Array.isArray(p) ? p : [p]});
}
/* the new hire's page: which events happened in this render? Show the most important new one. */
function events(v, list, done){
  if (done) return say("finish");
  const yellow = v.steps.filter(isMine).map(x => "yellow:" + x.id).filter(id => !seen().has(id));
  if (yellow.length) { markSeen("page"); return say(yellow[0]); }
  say("page");
}
function show(m){ SHOWN = m; PAGE = 0; drawMsg(true); }
function drawMsg(scroll){
  const m = SHOWN; if (!m) return;
  if (!$("#guide")) document.body.insertAdjacentHTML("beforeend", `<div class="tour-card" id="guide"></div>`);
  const w = WHO[m.who], card = $("#guide"), pg = m.pages[PAGE], team = typeof pg === "object" && pg.team;
  const text = typeof pg === "object" ? pg.text : pg, last = PAGE === m.pages.length - 1;
  const face = team
    ? `<span class="faces"><img src="/brand/av-ali.png" alt=""><img src="/brand/av-muthu.png" alt=""><img src="/brand/av-ahhock.png" alt=""></span>`
    : `<img class="face" src="${w.img}" alt="">`;
  card.innerHTML = `${face}
    <button class="gx" data-guide="off" aria-label="Close">&times;</button>
    <div class="who"><b>${team ? "Ali, Muthu and Ah Hock" : w.name}</b><span>${team ? "Day One" : w.role}</span></div>
    <p>${text}</p>
    ${m.pages.length > 1 ? `<div class="tour-ctl">
      <span class="dots">${m.pages.map((_, i) => `<i class="${i === PAGE ? "on" : ""}"></i>`).join("")}</span>
      ${PAGE > 0 ? '<button class="tb ghost" data-guide="back">Back</button>' : ""}
      <button class="tb" data-guide="${last ? "off" : "next"}">${last ? "Done" : "Next"}</button></div>` : ""}`;
  card.classList.add("on"); card.classList.remove("in"); void card.offsetWidth; card.classList.add("in");
  if (scroll) { const el = m.t && document.querySelector(m.t);
    if (el) { const r = el.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) el.scrollIntoView({block:"center"}); } }
  place();
}
function turn(d){ const m = SHOWN; if (!m) return; const i = PAGE + d;
  if (i < 0) return; if (i >= m.pages.length) return hideMsg(); PAGE = i; drawMsg(false); }
function hideMsg(){ SHOWN = null; const c = $("#guide"); if (c) c.classList.remove("on"); }
/* next to the target: below it if there is room, else above it, else beside it */
function place(){
  const m = SHOWN, card = $("#guide"); if (!m || !card) return;
  const el = m.t && document.querySelector(m.t);
  const cw = card.offsetWidth, ch = card.offsetHeight, gap = 18;
  let x = innerWidth - cw - 24, y = innerHeight - ch - 24, tail = "none";
  const wrap = $(".wrap").getBoundingClientRect();
  if (el && wrap.left - gap - cw >= 16) {            // the empty space left of the app: covers nothing
    const r = el.getBoundingClientRect();
    x = wrap.left - gap - cw; y = Math.max(16, Math.min(innerHeight - ch - 16, Math.max(r.top, 16)));
    tail = "right";
  } else if (el) {
    const r = el.getBoundingClientRect();
    x = Math.max(16, Math.min(innerWidth - cw - 16, r.left));
    if (r.bottom + gap + ch < innerHeight - 10) { y = r.bottom + gap; tail = "up"; }
    else if (r.top - gap - ch > 10) { y = r.top - gap - ch; tail = "down"; }
    else { y = Math.max(16, Math.min(innerHeight - ch - 16, r.top + 20));
      x = r.left - gap - cw > 10 ? r.left - gap - cw : Math.min(innerWidth - cw - 16, r.right + gap); }
  }
  card.style.left = Math.round(x) + "px"; card.style.top = Math.round(y) + "px"; card.dataset.tail = tail;
}
addEventListener("scroll", place, {passive:true});
addEventListener("resize", place);
/* your next action closes the message. Capture phase: it runs BEFORE the app's own click handler,
   so a click that causes a new event closes the old message first and then shows the new one. */
document.addEventListener("click", e => {
  if (e.target.closest("#guide")) { const g = e.target.closest("[data-guide]");
    if (g) { g.dataset.guide === "next" ? turn(1) : g.dataset.guide === "back" ? turn(-1) : hideMsg(); } return; }
  if (SHOWN) hideMsg();
}, true);
document.addEventListener("keydown", e => {
  if (!SHOWN || e.target.closest("input, select, textarea")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); turn(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); turn(-1); }
  else if (e.key === "Escape") hideMsg();
});
document.addEventListener("input", () => { if (SHOWN) hideMsg(); }, true);
/* ---------- clicks ---------- */
document.addEventListener("click", e => {
  const st = e.target.closest("[data-step]");
  if (st) { const k = st.dataset.step; EXP.has(k) ? EXP.delete(k) : EXP.add(k); rerender(); return; }
  if (e.target.closest("[data-stage]")) { TOGGLE.__all = !TOGGLE.__all; rerender(); return; }
  const c = e.target.closest("[data-car]");
  if (c) { const car = $("#car"), card = car && car.querySelector(".pc");
    if (car && card) car.scrollBy({left: (+c.dataset.car) * (card.offsetWidth + 12), behavior: "smooth"}); return; }
  const x = e.target.closest("[data-explore]");
  if (x) { $("#explore").scrollIntoView({behavior: "smooth", block: "start"});
    const car = $("#car"), card = car && car.querySelector(`[data-card="${x.dataset.explore}"]`);
    if (car && card) car.scrollTo({left: card.offsetLeft - car.offsetLeft, behavior: "smooth"}); return; }
  if (e.target.closest("[data-quiz]"))
    toast(`<span class="badge">?</span><span><b>The GTech quiz starts here.</b> Our quiz connects to this button.</span>`);
});
boot();
</script></body></html>
