<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day One</title>
<link rel="icon" type="image/png" href="/brand/favicon.png?v=6">
<style>
/* Self-hosted, so the demo does not depend on the venue Wi-Fi.
   Archivo: sharp poster grotesk for headings and labels. Inter: crisp body text. */
@font-face{font-family:"Archivo";src:url(/brand/fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:"Inter";src:url(/brand/fonts/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(/brand/fonts/jetbrains-mono.woff2) format("woff2");font-weight:400 800;font-display:swap}
/* ===================== DESIGN TOKENS =====================
   Jalur Gemilang only. Official CMYK (Jabatan Penerangan):
     blue C100 M75 Y0 K0 | red C0 M95 Y100 K0 | yellow C0 M9 Y100 K0
   to sRGB through the ColorSync Generic CMYK profile, relative colorimetric.
   Pantone 2768 / 199 / 108 for print. Every other colour below is one of
   these four at a lower opacity - no other hue is used.
   Shape language: soft, smooth, asymmetric. One corner on each surface is
   tighter than the other three. One shadow per surface, no blur effects. */
:root{
  --blue:#024B8F; --red:#DA332B; --yellow:#FEDD1B; --white:#FFFFFF;

  --ink:var(--blue);                    /* text is the flag navy */
  --mute:rgba(2,75,143,.74);
  --faint:rgba(2,75,143,.45);
  --line:rgba(2,75,143,.11);
  --wash:rgba(2,75,143,.045);           /* calm surfaces */
  --sun:#FFF8D1;                        /* flag yellow at 20% on white, flattened: opaque */
  --bg:#FFFFFF;

  /* asymmetric radii: big, big, big, small */
  --r-panel:30px 30px 30px 8px;
  --r-hero:40px 12px 40px 12px;
  --r-field:14px 14px 14px 5px;
  --r-btn:999px 999px 999px 9px;
  --r-pill:999px;

  --shadow:0 22px 44px -30px rgba(2,75,143,.42);
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --font:"Inter",-apple-system,"Segoe UI",sans-serif;
  --display:"Archivo","Inter",sans-serif;
  --pad:20px; --gap:24px;
}
/* ========================================================= */
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:450 14px/1.55 var(--font);font-feature-settings:"cv11","ss01"}
a{color:inherit}

/* poster layer */
.poster{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
/* bg.jpg is 2752x1536, so at 100vh tall it is 179.2vh wide; the hibiscus's right edge is at 49.2% = 88.2vh.
   The first card starts at 96vw - 880px. Tuck the flower 30px under it, and never open a gap on the left. */
.bg{position:absolute;top:0;height:100vh;width:auto;max-width:none;
  left:min(0px, calc(96vw - 850px - 88.2vh))}
.accent{position:absolute;right:0;bottom:0;width:min(19vw,330px);height:auto}
/* No page-wide grain layer: the art carries its own grain, and noise on the white paper reads as dirt.
   No blend modes or SVG filters on fixed layers either: they repaint the whole screen on every scroll. */
.tag{position:fixed;left:3vw;bottom:5vh;z-index:2;background:var(--yellow);color:var(--blue);
  font:600 10.5px/1.3 var(--mono);letter-spacing:.04em;text-transform:uppercase;
  writing-mode:vertical-rl;transform:rotate(180deg);padding:14px 10px;max-height:46vh;
  border-radius:16px 16px 4px 16px}
.tag b{font-weight:800}

/* page */
.wrap{position:relative;z-index:2;max-width:880px;margin:0 4vw 0 auto;padding:30px 0 64px}
@media (max-width:1100px){.wrap{margin:0 auto;padding:24px 18px 56px}.bg,.accent{opacity:.22}.tag{display:none}}

header{margin:0 0 28px}
header .mark{display:flex;align-items:center;gap:16px}
header .logo{width:200px;height:auto;display:block;margin:-4px 0 -4px -10px}
header .title{display:flex;flex-direction:column;gap:9px}
header b{font:900 52px/.9 var(--display);font-stretch:112%;letter-spacing:-.04em;color:var(--blue)}
header .with{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
header .with i{font:700 21px/1 var(--display);font-stretch:125%;font-style:normal;letter-spacing:-.01em;
  color:var(--red);margin:0 8px 2px 2px}
header .name{display:inline-block;font:800 14px/1 var(--display);font-stretch:108%;letter-spacing:0;
  padding:8px 14px 9px;border-radius:999px 999px 999px 7px}
header .n1{background:var(--blue);color:var(--white);transform:rotate(-4deg)}
header .n2{background:var(--red);color:var(--white);transform:rotate(3deg) translateY(3px)}
header .n3{background:var(--yellow);color:var(--blue);transform:rotate(-2deg) translateY(-1px)}
header .rule{height:4px;margin-top:18px;border-radius:999px;
  background:linear-gradient(90deg,var(--blue) 0 34%,var(--yellow) 34% 46%,var(--line) 46% 100%)}

h2{font:700 10.5px/1.2 var(--display);font-stretch:112%;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
.cols{display:flex;gap:var(--gap);align-items:flex-start}
.cols>.main{flex:1 1 57%;min-width:0}
.cols>.side{flex:1 1 43%;min-width:0}

/* surfaces */
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r-panel);
  padding:var(--pad);box-shadow:var(--shadow)}
.card{background:var(--white);border:1px solid var(--line);border-radius:22px 22px 22px 6px;
  padding:13px 15px;margin-bottom:10px}
.card b{font-size:14px}
.card p{margin:3px 0 8px;font-size:12.5px;color:var(--mute)}

/* the one card that matters */
.turn,.act{background:var(--sun);border:1px solid rgba(254,221,27,.75);border-radius:var(--r-hero);
  padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow)}
.turn.calm,.act.calm{background:var(--white);border:1px solid var(--line)}
.turn .k,.act .k{font:700 10.5px/1.2 var(--display);font-stretch:112%;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.turn.calm .k,.act.calm .k{color:var(--mute)}
.turn .v,.act .v{font:800 22px/1.15 var(--display);font-stretch:104%;margin:8px 0 6px;letter-spacing:-.02em;color:var(--blue)}
.turn .d,.act .d{font-size:13.5px;color:var(--mute)}
.howto{margin:14px 0 0;padding-left:20px;font-size:13.5px;line-height:1.65}
.howto li{margin-bottom:6px}
.howto li::marker{color:var(--blue);font-weight:800}
.pre{background:var(--white);border:1px solid var(--line);border-radius:16px 16px 16px 5px;
  padding:12px 14px;margin-top:12px;font-size:12.5px;line-height:1.6}
.pre table{width:100%;border-collapse:collapse}
.pre td{padding:3px 0;vertical-align:top}
.pre td:first-child{color:var(--mute);width:40%;padding-right:10px;font-size:11.5px}
.acts{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap}
.warn{margin:12px 0 0;font-size:12.5px;color:var(--red);font-weight:600}

/* form */
label{display:block;font:700 10.5px/1.2 var(--display);font-stretch:112%;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 7px}
.field{margin-bottom:14px}
input,select{width:100%;border:1px solid rgba(2,75,143,.2);border-radius:var(--r-field);padding:10px 13px;
  font:inherit;font-size:13.5px;background:var(--white);color:var(--blue);transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--faint)}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(254,221,27,.45)}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--wash);border-radius:var(--r-pill)}
.seg button{border:0;background:transparent;padding:7px 16px;font:650 12.5px/1.2 var(--display);font-stretch:106%;
  color:var(--mute);cursor:pointer;border-radius:var(--r-pill);transition:background .15s,color .15s}
.seg button.on{background:var(--blue);color:var(--white);font-weight:600}

/* buttons */
.btn{border:1px solid var(--blue);background:var(--blue);color:var(--white);border-radius:var(--r-btn);
  padding:10px 20px;font:700 13.5px/1.2 var(--display);font-stretch:106%;cursor:pointer;text-decoration:none;
  display:inline-block;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--white);color:var(--blue);border-color:rgba(2,75,143,.25)}
.btn.sm{padding:7px 15px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* plan preview */
.plan{font-size:13px}
.plan div{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.plan div:last-child{border-bottom:0}
.plan .why{color:var(--mute);font-size:11.5px;margin-left:auto;text-align:right}
.plan s{color:var(--faint)}

/* step list */
.steps{font-size:13.5px}
.steps .row{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.steps .row:last-child{border-bottom:0}
.steps em{font-style:normal;color:var(--mute);font-size:12px;display:block}
.ico{width:16px;height:16px;border-radius:50%;flex:none;margin-top:2px;border:1.5px solid var(--line);
  background:var(--white);display:flex;align-items:center;justify-content:center;color:var(--white);font-size:9px}
.ico.done{background:var(--blue);border-color:var(--blue)}
.ico.now{border:2.5px solid var(--blue)}
.ico.open{background:rgba(2,75,143,.16);border-color:transparent}

/* small things */
.chip{display:inline-block;background:var(--wash);border-radius:var(--r-pill);padding:2px 10px;
  font-size:10.5px;color:var(--mute);margin:0 4px 4px 0}
.chip.red{background:rgba(218,51,43,.1);color:var(--red)}
.doc{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);text-decoration:none}
.doc:last-child{border-bottom:0}
.new{background:rgba(218,51,43,.1);color:var(--red);border-radius:var(--r-pill);padding:1px 8px;font-size:10px;height:fit-content}
.link{background:var(--wash);border-radius:16px 16px 16px 5px;padding:11px 14px;font-size:12.5px;word-break:break-all;margin:12px 0}
.muted{color:var(--mute);font-size:12.5px}
.hide{display:none}

/* ---------- her page: the journey ---------- */
.steps,.sb{font-size:13.5px}
.row{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row em{font-style:normal;color:var(--mute);font-size:12px;display:block}
.tk{font:500 11.5px/1 var(--mono)}
.journey{padding:24px 24px 8px}
.hello .k{font:700 10.5px/1.2 var(--display);font-stretch:112%;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.hello h1{font:900 32px/1.02 var(--display);font-stretch:108%;letter-spacing:-.035em;margin:9px 0 6px;text-wrap:balance}
.hello p{margin:0 0 14px;color:var(--mute)}
.track{display:flex;gap:6px;margin:0 0 16px}
.track span{flex:1;height:8px;border-radius:999px;background:var(--line);overflow:hidden;position:relative}
.track span i{position:absolute;inset:0 auto 0 0;width:calc(var(--p) * 100%);background:var(--blue);border-radius:inherit}
.track span.here{background:rgba(2,75,143,.14)}
.stages{list-style:none;margin:0;padding:0}
.stage{border-top:1px solid var(--line)}
.sh{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:14px 2px}
.sh:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:12px}
.num{width:30px;height:30px;flex:none;border-radius:11px 11px 11px 4px;display:grid;place-items:center;
  font:800 13px/1 var(--display);border:1.5px solid rgba(2,75,143,.2);color:var(--mute);background:var(--white)}
.stage.complete .num{background:var(--blue);border-color:var(--blue);color:var(--white)}
.stage.here .num{border:2px solid var(--blue);color:var(--blue)}
.sn{flex:1;min-width:0}
.sn b{display:block;font:800 15.5px/1.2 var(--display);font-stretch:104%;letter-spacing:-.01em}
.sn em{font-style:normal;font-size:12.5px;color:var(--mute)}
.stage.complete .sn b{color:var(--mute)}
.sc{font:700 10px/1 var(--display);font-stretch:112%;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.stage.here .sc{color:var(--blue)}
.chev{width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);margin:0 4px 4px 2px;flex:none}
.stage.open .chev{transform:rotate(-135deg);margin:4px 4px 0 2px}
.sb{padding:0 0 14px 42px;max-width:720px}
.act{padding:18px 20px;margin:4px 0 10px;border-radius:30px 10px 30px 10px}
@keyframes pop{0%{transform:scale(.55)}55%{transform:scale(1.28)}100%{transform:scale(1)}}
.num.pop{animation:pop .6s cubic-bezier(.2,.9,.25,1.3)}

/* ---------- while you wait: one container, calm ---------- */
.stack>*+*{margin-top:16px}
.explore{padding:22px 24px 10px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:6px}
.ex-head h2{margin:0 0 6px}
.hook{margin:0;font-size:14px;color:var(--ink);max-width:560px}
.meter{display:flex;flex-direction:column;align-items:flex-end;gap:7px;font:700 10px/1 var(--display);font-stretch:112%;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mute);white-space:nowrap;padding-top:2px}
.meter .dots{display:flex;gap:4px}
.meter i{width:16px;height:5px;border-radius:999px;background:var(--line)}
.meter i.on{background:var(--blue)}
.prod{border-top:1px solid var(--line)}
.ph{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;width:100%;padding:11px 0}
.ph:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:12px}
.ini{width:30px;height:30px;flex:none;border-radius:10px 10px 10px 4px;display:grid;place-items:center;
  font:800 13px/1 var(--display);color:var(--blue);background:var(--wash);border:1px solid var(--line)}
.prod.seen .ini{background:var(--white)}
.ph .t{flex:1;min-width:0}
.ph b{font:800 14px/1.25 var(--display);font-stretch:104%}
.ph .chip{margin:0 0 0 8px;padding:1px 8px;font:700 9.5px/1.5 var(--display);letter-spacing:.06em;text-transform:uppercase;vertical-align:1px;
  background:transparent;border:1px solid rgba(2,75,143,.25);color:var(--blue)}
.ph em{display:block;font-style:normal;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick{font:800 13px/1 var(--display);color:var(--faint);width:14px;text-align:center}
.prod.seen .tick{color:var(--blue)}
.prod.open .ph em{display:none}
.pb{padding:0 0 14px 42px;font-size:13.5px;max-width:700px}
.pb p{margin:0 0 8px}
.links{display:flex;gap:16px;margin-top:6px;font:700 12.5px/1 var(--display)}
.links a{text-decoration:none;border-bottom:1.5px solid var(--blue);padding-bottom:2px}

/* ---------- achievements ---------- */
.toast{position:fixed;left:50%;bottom:28px;z-index:60;transform:translate(-50%,28px) scale(.96);opacity:0;
  display:flex;gap:12px;align-items:center;max-width:540px;padding:13px 20px 13px 13px;
  background:var(--blue);color:var(--white);font-size:13.5px;border-radius:22px 22px 22px 6px;
  box-shadow:0 26px 50px -24px rgba(2,75,143,.65);transition:transform .4s cubic-bezier(.2,.9,.25,1.25),opacity .25s}
.toast.in{transform:translate(-50%,0) scale(1);opacity:1}
.toast b{font-family:var(--display);font-weight:800}
.badge{width:36px;height:36px;flex:none;border-radius:12px 12px 12px 4px;background:var(--yellow);color:var(--blue);
  display:grid;place-items:center;font:900 16px/1 var(--display)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.finish{padding:24px 26px 20px}
.finish .heads{width:240px;display:block;margin:-8px 0 4px -10px;animation:rise .9s cubic-bezier(.2,.9,.25,1.25) both}
@keyframes rise{0%{transform:translateY(26px) scale(.85);opacity:0}100%{transform:none;opacity:1}}
.finish .k{font:700 10.5px/1.2 var(--display);font-stretch:112%;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.finish h1{font:900 38px/1 var(--display);font-stretch:108%;letter-spacing:-.035em;margin:9px 0 8px}
.next{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 8px}
.nx{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start;padding:15px 14px 14px;border-radius:24px 24px 24px 6px;
  animation:rise .7s cubic-bezier(.2,.9,.25,1.2) both;transition:transform .15s}
.nx:hover{transform:translateY(-2px)}
.nx:nth-child(2){animation-delay:.12s} .nx:nth-child(3){animation-delay:.24s}
.nx small{display:block;font:700 9.5px/1 var(--display);font-stretch:112%;letter-spacing:.1em;text-transform:uppercase;opacity:.8;margin-bottom:9px}
.nx b{display:block;font:850 15.5px/1.15 var(--display);letter-spacing:-.01em;margin-bottom:6px}
.nx span{display:block;font-size:12px;line-height:1.4;opacity:.85}
.nx{background:var(--white);color:var(--blue);border:1px solid rgba(2,75,143,.18)}
.nx:first-child{border-color:var(--blue)}
.more{all:unset;cursor:pointer;font:700 12.5px/1 var(--display);border-bottom:1.5px solid var(--blue);padding-bottom:2px;margin-top:6px}
@media (prefers-reduced-motion: reduce){.finish .heads,.nx,.num.pop{animation:none}}
</style></head>
<body>
<div class="poster" aria-hidden="true"><img class="bg" src="/brand/bg.jpg?v=6" alt=""><img class="accent" src="/brand/accent.png?v=6" alt=""></div>
<div class="tag"><b>KopiCode 2026 presents</b><br>Day One: onboarding<br>Ali &middot; Muthu &middot; Ah Hock<br>13/11/26</div>
<div class="wrap">
<header>
  <div class="mark">
    <img class="logo" src="/brand/logo-420.png?v=6" alt="Ali, Muthu and Ah Hock">
    <div class="title">
      <b>Day&nbsp;One</b>
      <div class="with"><i>with</i><span class="name n1">Ali</span><span class="name n2">Muthu</span><span class="name n3">Ah&nbsp;Hock</span></div>
    </div>
  </div>
  <div class="rule"></div>
</header>
<div id="app"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const api = (p, o) => fetch("/api" + p, o).then(r => r.json());
let F = {employment:"staff", job_family:"developer", project:"odin", want_claude:true};
let PROJECTS = {}, TIMER = null, DIR = null, LAST = "";

const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* Malaysian names: never take the first word blindly. "Lim Wei Jie" starts with the family name,
   so keep the whole name, and stop only at bin / binti / a/l / a/p / s/o / d/o. */
const callName = n => (n||"").split(/\s+(?:binti|bin|bte|bt|a\/l|a\/p|s\/o|d\/o)\s+/i)[0].trim();

async function boot(){
  PROJECTS = await api("/projects");
  const m = location.pathname.match(/^\/n\/(.+)$/);
  if (m) { watch(m[1]); } else { renderForm(); }
}

/* ---------- the form ---------- */
function renderForm(){
  const opts = Object.keys(PROJECTS).sort().map(k =>
    `<option value="${k}" ${k===F.project?"selected":""}>${k}</option>`).join("");
  $("#app").innerHTML = `
  <div class="cols">
    <div class="main panel">
      <div class="hello"><div class="k">New hire</div><h1>Start someone</h1>
        <p>One form. Day One raises every request in the right order.</p></div>
      <div class="field"><label>Full name</label><input id="name" placeholder="Nurul Aina binti Rahim"></div>
      <div class="field"><label>Your Gamuda email — the request is raised in your name</label>
        <input id="starter" placeholder="you@gamuda.com.my"></div>
      <div class="field"><label>Employment</label>
        <div class="seg" id="seg-emp">
          <button data-v="staff">Staff</button><button data-v="intern">Intern</button></div></div>
      <div class="field"><label>Job</label>
        <div class="seg" id="seg-job">
          <button data-v="developer">Developer</button><button data-v="other">Non-developer</button></div></div>
      <div class="field"><label>Project — optional</label>
        <select id="project"><option value="">no project yet</option>${opts}</select></div>
      <div class="field"><label>Start date — optional</label><input id="start" placeholder="17-11-2026"></div>
      <button class="btn" id="go">Start onboarding</button>
      <div id="err" class="muted" style="margin-top:9px"></div>
    </div>
    <div class="side panel">
      <h2>What we will ask for</h2>
      <div id="plan" class="plan"></div>
    </div>
  </div>`;
  bindSeg("#seg-emp", "employment"); bindSeg("#seg-job", "job_family");
  $("#project").onchange = e => { F.project = e.target.value; preview(); };
  $("#go").onclick = submit;
  preview();
}
function bindSeg(sel, key){
  const box = $(sel);
  [...box.children].forEach(b => {
    b.classList.toggle("on", b.dataset.v === F[key]);
    b.onclick = () => { F[key] = b.dataset.v;
      [...box.children].forEach(x => x.classList.toggle("on", x === b)); preview(); };
  });
}
async function preview(){
  const q = new URLSearchParams({employment:F.employment, job_family:F.job_family,
                                 want_claude:F.want_claude});
  if (F.project) q.set("project", F.project);
  const p = await api("/preview?" + q);
  const chan = {gsd_auto:"GSD", slack_guided:"Slack", self:"you", person:"a person"};
  $("#plan").innerHTML =
    p.steps.map(s => `<div><span>${esc(s.title)}</span><span class="why">${chan[s.channel]}</span></div>`).join("")
    + p.skipped.map(s => `<div><s>${esc(s.title)}</s><span class="why">${esc(s.why)}</span></div>`).join("")
    + `<div style="border:0;padding-top:9px"><b>${p.steps.length} requests</b>
       <span class="why">${p.skipped.length} skipped</span></div>`;
}
async function submit(){
  const name = $("#name").value.trim(), starter = $("#starter").value.trim();
  if (!name || !starter) { $("#err").textContent = "Name and your email are both needed."; return; }
  $("#go").disabled = true;
  const v = await api("/onboardings", {method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({name, starter_email:starter, employment:F.employment,
      job_family:F.job_family, project:F.project||null, start_date:$("#start").value.trim()})});
  const url = location.origin + "/n/" + v.token;
  $("#app").innerHTML = `<div class="panel" style="max-width:560px">
    <h2>Started</h2>
    <div class="turn"><div class="k">Raised now</div>
      <div class="v">1 request is open</div>
      <div class="d">${v.progress.total - 1} more are queued behind it. They go out by themselves.</div></div>
    <p class="muted">Send ${esc(callName(name))} this link. There is no password.</p>
    <div class="link">${url}</div>
    <div class="acts"><button class="btn" onclick="location.href='/n/${v.token}'">Open her page</button>
    <button class="btn ghost sm" onclick="navigator.clipboard.writeText('${url}')">Copy link</button></div>
  </div>`;
}

/* ---------- her page ---------- */
/* Four stages. The step she must act on opens INSIDE its stage, so the action sits in the process. */
const STAGES = [
  {key:"account", name:"Account",          blurb:"Your Gamuda email and your own password", ids:["email","password_reset"]},
  {key:"hr",      name:"HR and help desk", blurb:"GEMS, GES and the GSD portal",            ids:["gems","ges","gsd"]},
  {key:"tools",   name:"Work tools",       blurb:"Slack, Atlassian, Bitbucket, Claude Code", ids:["slack","atlassian","bitbucket","claude_seat"]},
  {key:"project", name:"Your project",     blurb:"GCP access and the repo",                 ids:["gcp","repo_access"]},
];
const NEXT_TIP = {
  account: "IT has it from here. Meet your project on the right while you wait.",
  hr:      "Your GSD portal works now: you can raise your own IT tickets.",
  tools:   "Slack is ready. Say hello to your team, then try the GTech quiz.",
  project: "You can open the repo now.",
};
let TOKEN = "", V = null, TOGGLE = {}, PROD = null, FIRST = true;
const mem = {
  get: k => { try { return JSON.parse(localStorage.getItem(`dayone:${TOKEN}:${k}`)); } catch(e){ return null; } },
  set: (k, v) => { try { localStorage.setItem(`dayone:${TOKEN}:${k}`, JSON.stringify(v)); } catch(e){} },
};
function watch(token){
  TOKEN = token;
  const tick = async () => { try { await render(await api("/n/" + token), token); } catch(e){ console.warn(e); } };
  tick(); clearInterval(TIMER); TIMER = setInterval(tick, 1500);
}
const rerender = () => { LAST = ""; if (V) render(V, TOKEN); };

function stagesOf(v){
  const byId = Object.fromEntries(v.steps.map(s => [s.id, s]));
  const list = STAGES.map(g => ({...g, steps: g.ids.map(i => byId[i]).filter(Boolean)})).filter(g => g.steps.length);
  list.forEach(g => {
    g.done = g.steps.filter(s => s.state === "done").length;
    g.complete = g.done === g.steps.length;
    g.withIT = g.steps.filter(s => s.state === "open").length;
    g.mine = g.steps.some(s => s.state === "waiting_person" || (s.state === "waiting_user" && !s.held_by.length));
  });
  const here = list.find(g => !g.complete);
  list.forEach(g => { g.here = g === here; g.open = g.key in TOGGLE ? TOGGLE[g.key] : (g.here || g.mine); });
  return list;
}
const CH = {
  self:   {k:"Your turn", act:"I have done it"},
  slack_guided:{k:"Your turn &middot; this one is in Slack, not GSD", act:"I have sent it"},
  person: {k:"Waiting on a person", act:"He has added me"},
};
function act(v, t){
  const c = (t.then_self && t.state === "waiting_user") ? {k:"Your turn &middot; IT has granted it", act:"I am in"} : (CH[t.channel] || CH.self);
  const n = v.your_turn_count || 1;
  const fields = (t.fields||[]).length ? `<div class="pre"><table>${
      t.fields.map(f => `<tr><td>${esc(f.label)}</td><td>${esc(f.value)}</td></tr>`).join("")}</table></div>` : "";
  const howto = (t.howto||[]).length ? `<ol class="howto">${t.howto.map(h => `<li>${esc(h)}</li>`).join("")}</ol>` : "";
  const ask = t.ask ? `<div class="pre">${esc(t.ask)}</div>` : "";
  const emailAsk = t.ask_email ? `<div class="pre">
      <label>Which address did you sign in with?</label>
      <input id="we" value="${esc(v.guess_email)}">
      <span class="muted">We guessed it from your name. Correct it if it differs.</span></div>` : "";
  const copy = (t.fields||[]).length ? t.fields.map(f => f.label + ": " + f.value).join("\n") : t.ask;
  const exp = t.id === "password_reset" && v.link_expires_in_hours !== null
    ? (v.link_expires_in_hours > 0
        ? `<p class="warn">Google's sign-in link expires in ${Math.floor(v.link_expires_in_hours)} hours.</p>`
        : `<p class="warn">That link has expired. IT must reset the account: raise a GSD ticket.</p>`) : "";
  return `<div class="act ${t.channel==="person"?"calm":""}">
    <div class="k">${c.k}${n > 1 ? ` &middot; 1 of ${n}` : ""}</div>
    <div class="v">${esc(t.title)}</div>
    <div class="d">${esc(t.hint || "")}</div>
    ${howto}${fields}${ask}${emailAsk}${exp}
    ${t.id==="password_reset" ? '<p class="muted" style="margin-top:9px">Day One never sees or stores your password.</p>' : ""}
    <div class="acts">
      <button class="btn sm" onclick="confirmStep('${TOKEN}','${t.id}')">${c.act}</button>
      ${copy ? `<button class="btn ghost sm" data-copy="${esc(copy)}" onclick="navigator.clipboard.writeText(this.dataset.copy)">Copy</button>`:""}
      ${t.channel==="person" && v.poc_email ? `<a class="btn ghost sm" href="mailto:${v.poc_email}">Email ${esc(v.poc_name)}</a>`:""}
    </div></div>`;
}
function row(v, s){
  const held = s.state === "waiting_user" && (s.held_by||[]).length;
  const ico = s.state==="done" ? '<span class="ico done">&#10003;</span>'
    : s.state==="open" || held ? '<span class="ico open"></span>'
    : s.state.startsWith("waiting") ? '<span class="ico now"></span>' : '<span class="ico"></span>';
  const sub = s.state==="done" ? "ready"
    : s.state==="open" ? `with IT &middot; <span class="tk">GSD #${s.ticket_id}</span> &middot; usually ${s.eta_days} days`
    : held ? `IT granted it &middot; yours after ${esc(s.held_by.join(", "))}`
    : s.state==="waiting_user" ? "your turn, next"
    : s.state==="waiting_person" ? `${esc(v.poc_name)} does this`
    : "queued &middot; goes out after " + esc(s.blocked_by.join(", "));
  return `<div class="row">${ico}<span>${esc(s.title)}<em>${sub}</em></span></div>`;
}
function journey(v, list){
  const here = list.find(g => g.here), idx = list.indexOf(here) + 1;
  const first = esc(callName(v.name));
  const withIT = v.steps.filter(s => s.state === "open").length;
  const n = v.your_turn_count || 0;
  const line = n ? (n > 1 ? `${n} things for you. The first is open below.` : "1 thing for you. It is open below.")
    : withIT ? `Nothing for you right now. IT is working on ${withIT} request${withIT>1?"s":""}.` : "";
  return `<section class="journey panel">
    <div class="hello">
      <div class="k">Welcome, ${first} &middot; stage ${idx} of ${list.length}</div>
      <h1>${esc(here.name)}</h1>
      <p>${line}</p>
      <div class="track">${list.map(g => `<span class="${g.complete?"done":g.here?"here":""}" style="--p:${g.done/g.steps.length}"><i></i></span>`).join("")}</div>
    </div>
    ${stageList(v, list)}
  </section>`;
}
function stageList(v, list){
  return `<ol class="stages">${list.map((g, i) => {
    const status = g.complete ? "Done" : g.here ? "You are here" : g.mine ? "Your turn" : g.withIT ? `${g.withIT} with IT` : "Later";
    const body = g.open ? `<div class="sb">${g.steps.map(s => v.your_turn && s.id === v.your_turn.id ? act(v, s) : row(v, s)).join("")}
      ${g.key==="account" && v.work_email ? `<p class="muted" style="margin:10px 0 0">Your address: <b>${esc(v.work_email)}</b></p>` : ""}</div>` : "";
    return `<li class="stage ${g.complete?"complete":""} ${g.here?"here":""} ${g.open?"open":""}" data-key="${g.key}">
      <button class="sh" data-stage="${g.key}">
        <span class="num">${g.complete ? "&#10003;" : i + 1}</span>
        <span class="sn"><b>${esc(g.name)}</b><em>${esc(g.blurb)}</em></span>
        <span class="sc">${status} &middot; ${g.done}/${g.steps.length}</span><span class="chev"></span>
      </button>${body}</li>`; }).join("")}</ol>`;
}
function finish(v, list, d){
  const mine = d.find(x => x.key === (v.project||"").toLowerCase());
  return `<section class="finish panel">
    <img class="heads" src="/brand/logo-420.png?v=6" alt="">
    <div class="k">Day One &middot; complete</div>
    <h1>You are set, ${esc(callName(v.name))}.</h1>
    <p class="muted">${v.progress.total} of ${v.progress.total} ready. Every account works. Here is where to go next.</p>
    <div class="next">
      ${mine ? `<a class="nx" href="${mine.docs_url || mine.url}" target="_blank"><small>Your project</small><b>Start on ${esc(mine.name)}</b><span>Ask ${esc(mine.poc_name)} for your first task.</span></a>` : ""}
      <button class="nx" data-quiz="1"><small>Two minutes</small><b>Take the GTech quiz</b><span>See how much you picked up.</span></button>
      <button class="nx" data-explore="${(d.find(x => !mine || x.key !== mine.key) || d[0]).key}"><small>Explore</small><b>Meet the other products</b><span>${d.length} products, one line each.</span></button>
    </div>
    <button class="more" data-stage="__all">${TOGGLE.__all ? "Hide" : "See"} all ${v.progress.total} steps</button>
  </section>
  ${TOGGLE.__all ? `<section class="journey panel" style="margin-top:14px">${stageList(v, list)}</section>` : ""}`;
}
function explore(v, d){
  const seen = new Set(mem.get("explored") || []);
  const open = v.steps.filter(x => x.state === "open");
  const eta = Math.max(0, ...open.map(x => x.eta_days || 0));
  const mine = d.find(x => x.key === (v.project||"").toLowerCase());
  const list = mine ? [mine, ...d.filter(x => x !== mine)] : d;
  const ready = v.progress.done === v.progress.total;
  const hook = ready ? "Meet what GTech builds."
    : open.length ? `${open.length === 1 ? esc(open[0].title) + " is" : open.length + " requests are"} with IT, about ${eta}&nbsp;day${eta>1?"s":""}. Meanwhile, meet what GTech builds.`
    : "Meet what GTech builds.";
  return `<section class="panel explore" id="explore">
    <div class="ex-head">
      <div><h2>${ready ? "Next for you" : "While you wait"}</h2><p class="hook">${hook}</p></div>
      <div class="meter"><span>${seen.size} of ${d.length} explored</span>
        <span class="dots">${d.map(x => `<i class="${seen.has(x.key)?"on":""}"></i>`).join("")}</span></div>
    </div>
    ${list.map(x => `<div class="prod ${PROD===x.key?"open":""} ${seen.has(x.key)?"seen":""}">
      <button class="ph" data-explore="${x.key}">
        <span class="ini">${esc(x.name[0])}</span>
        <span class="t"><b>${esc(x.name)}</b>${mine && x.key===mine.key ? '<span class="chip">your project</span>' : ""}<em>${esc(x.one_line||"")}</em></span>
        <span class="tick">${seen.has(x.key) ? "&#10003;" : "&rarr;"}</span>
      </button>
      ${PROD===x.key ? `<div class="pb">
        <p>${esc(x.one_line||"")}</p>
        ${x.try_in_5 ? `<p><b>Try in 5 minutes:</b> ${esc(x.try_in_5)}</p>` : ""}
        <div>${(x.stack||[]).map(t => `<span class="chip">${esc(t)}</span>`).join("")}<span class="chip">ask ${esc(x.poc_name)}</span></div>
        <div class="links"><a href="${x.url}" target="_blank">Open it &rarr;</a>
          ${x.docs_url ? `<a href="${x.docs_url}" target="_blank">Docs &rarr;</a>` : ""}
          ${x.poc_email ? `<a href="mailto:${x.poc_email}">Email ${esc(x.poc_name)}</a>` : ""}</div>
      </div>` : ""}
    </div>`).join("")}
    <div class="prod quizrow">
      <button class="ph" data-quiz="1">
        <span class="ini">?</span>
        <span class="t"><b>GTech quiz</b><em>${seen.size >= 3 ? "You have explored enough. Ready?" : "Two minutes. Best after 3 products."}</em></span>
        <span class="tick">&rarr;</span>
      </button>
    </div>
  </section>`;
}
async function confirmStep(token, step){
  const el = document.querySelector("#we");
  await render(await api(`/n/${token}/steps/${step}/confirm`, {method:"POST",
    headers:{"content-type":"application/json"},
    body: JSON.stringify({work_email: el ? el.value.trim() : ""})}), token);
}
/* Polling runs every 1.5 s. Build the whole screen as one string and touch the DOM only when that
   string changes: no empty column between polls, no lost hover, no reset of what she types. */
async function render(v, token){
  if (!DIR) DIR = await api("/directory");
  V = v;
  const list = stagesOf(v);
  const done = v.progress.done === v.progress.total;
  const html = `<div class="stack">
    ${done ? finish(v, list, DIR) : journey(v, list)}
    ${explore(v, DIR)}
  </div>`;
  if (html !== LAST) {
    const we = $("#we"), typed = we ? we.value : null, focused = we && document.activeElement === we;
    LAST = html;
    $("#app").innerHTML = html;
    const we2 = $("#we");
    if (we2 && typed !== null) { we2.value = typed; if (focused) we2.focus(); }
  }
  celebrate(list, done);
}
/* ---------- achievements ---------- */
function celebrate(list, done){
  const seen = new Set(mem.get("celebrated") || []);
  const fresh = list.filter(g => g.complete && !seen.has(g.key));
  const allFresh = done && !seen.has("__all");
  if (!fresh.length && !allFresh) { FIRST = false; return; }
  fresh.forEach(g => seen.add(g.key)); if (done) seen.add("__all");
  mem.set("celebrated", [...seen]);
  if (allFresh) {
    const h = document.querySelector(".finish .heads"), r = h ? h.getBoundingClientRect() : {left:innerWidth/2, top:200, width:0};
    confetti(r.left + r.width/2, r.top + 60, 180); setTimeout(() => confetti(innerWidth*0.75, innerHeight*0.35, 120), 350);
    FIRST = false; return;
  }
  const g = fresh[fresh.length - 1], i = list.indexOf(g), next = list[i + 1];
  const num = document.querySelector(`.stage[data-key="${g.key}"] .num`);
  if (num) { num.classList.add("pop"); const r = num.getBoundingClientRect(); confetti(r.left + r.width/2, r.top + r.height/2, 110); }
  toast(`<span class="badge">&#10003;</span><span><b>${esc(g.name)} done.</b> ${next ? `Next: ${esc(next.name)}. ` : ""}${NEXT_TIP[g.key] || ""}</span>`);
  FIRST = false;
}
function toast(html){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = html;
  document.body.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add("in")));
  setTimeout(() => { t.classList.remove("in"); setTimeout(() => t.remove(), 400); }, 5600);
}
function confetti(x, y, n){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"), dpr = devicePixelRatio || 1;
  c.className = "confetti"; c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  document.body.appendChild(c);
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  const cols = ["#024B8F", "#DA332B", "#FEDD1B"];
  const P = Array.from({length: n}, () => { const a = -Math.PI/2 + (Math.random() - .5) * Math.PI * .95, sp = 5 + Math.random() * 9;
    return {x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
            w: 5 + Math.random() * 6, h: 3 + Math.random() * 3, c: cols[Math.floor(Math.random() * 3)]}; });
  const t0 = performance.now();
  (function frame(t){
    const k = (t - t0) / 1000; g.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => { p.vy += .3; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.globalAlpha = Math.max(0, 1 - k / 2.2);
      g.fillStyle = p.c; g.fillRect(-p.w/2, -p.h/2, p.w, p.h); g.restore(); });
    if (k < 2.2) requestAnimationFrame(frame); else c.remove();
  })(t0);
}
/* ---------- clicks ---------- */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-stage]");
  if (s) { const k = s.dataset.stage, li = s.closest(".stage");
    TOGGLE[k] = k === "__all" ? !TOGGLE.__all : !(li && li.classList.contains("open")); rerender(); return; }
  const x = e.target.closest("[data-explore]");
  if (x) { const k = x.dataset.explore, seen = new Set(mem.get("explored") || []), before = seen.size;
    PROD = (PROD === k && x.classList.contains("ph")) ? null : k; seen.add(k); mem.set("explored", [...seen]);
    rerender();
    const el = document.querySelector(".prod.open"); if (el && !x.classList.contains("ph")) el.scrollIntoView({behavior:"smooth", block:"center"});
    if (DIR && before < DIR.length && seen.size === DIR.length) {
      const r = x.getBoundingClientRect(); confetti(r.left + r.width/2, r.top, 120);
      toast(`<span class="badge">5</span><span><b>You have met every GTech product.</b> Now test yourself with the quiz.</span>`); }
    return; }
  if (e.target.closest("[data-quiz]")) {
    toast(`<span class="badge">?</span><span><b>The GTech quiz opens here.</b> Our teammate's quiz plugs into this button.</span>`); }
});
boot();
</script></body></html>
