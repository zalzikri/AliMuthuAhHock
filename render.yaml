services:
  - type: web
    name: day-one
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SERVICEDESK
        value: mock
      - key: DEMO_SECONDS
        value: "3"
      - key: DB_PATH
        value: /tmp/dayone.db
      - key: PYTHON_VERSION
        value: "3.11.9"
